<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Language Mirror · Weather</title>
<style>
:root{
  --bg:#f4f1e8;--card:#fffdf8;--text:#1d211f;--muted:#606761;--line:#d5d2c8;
  --accent:#286957;--accent2:#e5f2ed;--why:#edf3ff;--whyline:#9bb0d5;
  --good:#e4f5e9;--goodline:#4f9464;--bad:#fff0ed;--badline:#bf6555;
  --memory:#fff7da;--memoryline:#d7b85b;--shadow:0 3px 14px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:24px;line-height:1.5}
button,textarea{font:inherit}
main{max-width:760px;margin:0 auto;padding:20px 14px 90px}
h1{font-size:clamp(42px,10vw,64px);line-height:1.04;margin:4px 0 10px}
h2{font-size:clamp(31px,7vw,42px);line-height:1.14;margin:0 0 12px}
h3{font-size:clamp(26px,6vw,32px);line-height:1.2;margin:0 0 8px}
p{margin:8px 0 14px}
.small{font-size:19px}.muted{color:var(--muted)}
.eyebrow{font-size:18px;font-weight:900;letter-spacing:.05em;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin:16px 0;box-shadow:var(--shadow);overflow-wrap:anywhere}
.section{margin:34px 0}.section-help{font-size:21px;color:var(--muted);margin:-2px 0 16px}
.tabs{display:grid;gap:10px}
.btn{display:block;width:100%;min-height:66px;border:2px solid var(--line);border-radius:16px;background:var(--card);color:var(--text);padding:14px 16px;font-weight:850;cursor:pointer;touch-action:manipulation;white-space:normal;overflow-wrap:anywhere}
.btn:focus-visible{outline:4px solid rgba(40,105,87,.25);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.active{border-color:var(--accent);outline:5px solid var(--accent2)}
.btn.good{background:var(--good);border-color:var(--goodline)}
.btn.bad{background:var(--bad);border-color:var(--badline)}
.hidden{display:none!important}

/* Learn cards */
.learn-list{display:grid;gap:14px}
.learn-card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow);overflow:hidden}
.learn-top{display:grid;grid-template-columns:86px minmax(0,1fr);gap:14px;align-items:center}
.icon{font-size:64px;line-height:1;text-align:center}
.target{font-size:clamp(30px,8vw,42px);font-weight:950;line-height:1.15;overflow-wrap:anywhere}
.answer{margin-top:14px;padding:15px;border-radius:16px;background:var(--accent2);font-size:25px;font-weight:800}
.audio{margin-top:13px;background:var(--accent);color:#fff;border:0;border-radius:15px;min-height:62px;padding:12px 18px;font-weight:900;cursor:pointer}
.audio-status{font-size:18px;color:var(--muted);min-height:24px;margin-top:5px}

/* memory + notes */
.memory{margin-top:14px;background:var(--memory);border:2px solid var(--memoryline);border-radius:16px;padding:14px;font-size:20px}
.note-block{margin-top:14px}
.note-label{display:block;font-weight:900;margin-bottom:7px}
textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:15px;background:white;color:var(--text);padding:13px;font-size:21px;resize:vertical}
.saved{font-size:18px;color:var(--accent);font-weight:800;margin-top:6px;min-height:24px}

/* WHY */
.why{background:var(--why);border-color:var(--whyline)}
.big-why{font-size:27px;font-weight:950;line-height:1.3}
.families{display:grid;gap:10px;margin:16px 0}
.family{background:rgba(255,255,255,.8);border:2px solid rgba(86,110,157,.22);border-radius:16px;padding:14px}
.family-name{font-size:29px;font-weight:950}
.family-icon{font-size:32px;margin-right:7px}
.remember{border-left:7px solid var(--accent);padding:12px 14px;background:white;border-radius:0 14px 14px 0;font-weight:850}

/* phrases */
.phrase-list{display:grid;gap:12px}
.phrase-card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px}
.phrase-target{font-size:29px;font-weight:950;line-height:1.2}
.phrase-source{font-size:20px;color:var(--muted);margin-top:5px}

/* say */
.say-card{text-align:center}
.say-icon{font-size:88px;line-height:1}
.reveal{margin-top:12px;background:var(--accent2);border-radius:16px;padding:15px;font-size:30px;font-weight:950}

/* quiz */
.quizq{padding:20px 0;border-top:2px solid var(--line)}
.quizq:first-child{border-top:0;padding-top:0}
.quizprompt{font-size:28px;font-weight:950;margin-bottom:11px}
.options{display:grid;gap:9px}
.result{margin-top:12px;padding:15px;border-radius:16px;font-size:21px}
.result.good{background:var(--good);border:2px solid var(--goodline)}
.result.bad{background:var(--bad);border:2px solid var(--badline)}
.result strong{font-size:25px}

/* AI */
.steps{display:grid;gap:10px;margin:16px 0}
.step{display:grid;grid-template-columns:50px minmax(0,1fr);gap:12px;align-items:center;background:var(--accent2);padding:14px;border-radius:16px}
.num{width:50px;height:50px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:950}
.copy-ok{margin-top:10px;padding:14px;background:var(--good);border:2px solid var(--goodline);border-radius:14px;font-weight:850}
.prompt{font-size:16px;white-space:pre-wrap;background:#efeee8;border:2px solid var(--line);border-radius:14px;padding:12px;max-height:320px;overflow:auto}
summary{cursor:pointer;font-weight:900;font-size:21px}

/* feedback */
.feedback-grid{display:grid;gap:9px}

@media(min-width:800px){
  main{max-width:900px}
  .tabs{grid-template-columns:1fr 1fr}
  .families{grid-template-columns:1fr 1fr}
  .phrase-list{grid-template-columns:1fr 1fr}
  body{font-size:25px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<main>
<header>
  <div class="eyebrow">LANGUAGE MIRROR · PROTOTYPE 002</div>
  <h1>Weather / El tiempo</h1>
  <div id="updated" class="small muted"></div>
</header>

<section class="card">
  <h2>Choose your side / Elige tu lado</h2>
  <div class="tabs">
    <button id="tab-en_es" class="btn" onclick="setDirection('en_es')">🇬🇧 I speak English<br><span class="small">I'm learning Spanish</span></button>
    <button id="tab-es_en" class="btn" onclick="setDirection('es_en')">🇪🇸 Hablo español<br><span class="small">aprendo inglés</span></button>
  </div>
</section>

<div id="app" class="hidden">

<section class="section">
  <h2 id="learnTitle"></h2>
  <div id="learnHelp" class="section-help"></div>
  <div id="learnList" class="learn-list"></div>
</section>

<section class="card why">
  <h2>2 · WHY?</h2>
  <div id="whyHeadline" class="big-why"></div>
  <p id="whyIntro"></p>
  <div id="families" class="families"></div>
  <div id="whyRemember" class="remember"></div>
  <details style="margin-top:15px">
    <summary id="moreTitle"></summary>
    <p id="moreWhy"></p>
  </details>
</section>

<section class="section">
  <h2 id="phrasesTitle"></h2>
  <div id="phrasesHelp" class="section-help"></div>
  <div id="phraseList" class="phrase-list"></div>
</section>

<section class="section">
  <h2 id="sayTitle"></h2>
  <div id="sayHelp" class="section-help"></div>
  <div id="sayList" class="learn-list"></div>
</section>

<section class="card">
  <h2 id="practiceTitle"></h2>
  <div id="practiceHelp" class="section-help"></div>
  <div id="quiz"></div>
  <div id="score" style="font-size:29px;font-weight:950"></div>
</section>

<section class="card">
  <h2 id="aiTitle"></h2>
  <p id="aiHelp"></p>
  <div class="steps">
    <div class="step"><div class="num">1</div><div id="step1"></div></div>
    <div class="step"><div class="num">2</div><div id="step2"></div></div>
    <div class="step"><div class="num">3</div><div id="step3"></div></div>
  </div>
  <button id="copyPrompt" class="btn primary" onclick="copyAIPrompt()"></button>
  <div id="copyStatus"></div>
  <details style="margin-top:15px">
    <summary id="seePrompt"></summary>
    <div id="prompt" class="prompt"></div>
  </details>
</section>

<section class="card">
  <h2 id="feedbackTitle"></h2>
  <p id="feedbackHelp"></p>
  <div class="feedback-grid">
    <button id="fb1" class="btn" onclick="rate('helped')"></button>
    <button id="fb2" class="btn" onclick="rate('more_examples')"></button>
    <button id="fb3" class="btn" onclick="rate('confused')"></button>
  </div>
  <p id="freeHelp" style="margin-top:18px"></p>
  <textarea id="generalFeedback"></textarea>
  <button id="saveFeedback" class="btn primary" style="margin-top:9px" onclick="saveGeneralFeedback()"></button>
  <div id="feedbackStatus" class="saved"></div>

  <details style="margin-top:22px">
    <summary id="creatorLabel"></summary>
    <div style="display:grid;gap:9px;margin-top:10px">
      <button id="copyReport" class="btn" onclick="copyReportData()"></button>
      <button id="exportReport" class="btn" onclick="exportReportData()"></button>
    </div>
  </details>
</section>

</div>
</main>

<script>
let C=null,direction=localStorage.getItem('lm_direction_v2')||'',answers={};
const KEY='language_mirror_v2_state';

function state(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function patch(x){localStorage.setItem(KEY,JSON.stringify(Object.assign(state(),x,{updatedAt:new Date().toISOString()})))}
function D(){return C.directions[direction]}
function tr(es,en){return D().ui_language==='es'?es:en}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

fetch('course.json?ts='+Date.now())
.then(r=>{if(!r.ok)throw new Error(r.status);return r.json()})
.then(x=>{C=x;document.getElementById('updated').textContent='Updated / Actualizado: '+C.updated;if(direction)setDirection(direction)})
.catch(e=>{document.body.insertAdjacentHTML('beforeend','<p style="padding:20px">Could not load course.json.</p>')});

function setDirection(d){
 direction=d;localStorage.setItem('lm_direction_v2',d);answers={};
 document.getElementById('app').classList.remove('hidden');
 document.querySelectorAll('[id^=tab-]').forEach(x=>x.classList.remove('active'));
 document.getElementById('tab-'+d).classList.add('active');
 render();
}
function render(){
 document.documentElement.lang=D().ui_language;
 document.getElementById('learnTitle').textContent=tr('1 · APRENDE','1 · LEARN');
 document.getElementById('learnHelp').textContent=tr(
   'Mira y escucha la expresión. Intenta entenderla antes de mostrar el significado.',
   'Look and listen. Try to remember what the Spanish means before you reveal the English.'
 );
 document.getElementById('phrasesTitle').textContent=tr('3 · FRASES ÚTILES','3 · USEFUL PHRASES');
 document.getElementById('phrasesHelp').textContent=tr(
   'No aprendas solo palabras: practica frases que realmente podrías decir.',
   'Practise things you could really say in everyday conversation.'
 );
 document.getElementById('sayTitle').textContent=tr('4 · MIRA Y DI','4 · LOOK & SAY');
 document.getElementById('sayHelp').textContent=tr(
   'Mira la imagen. Di la frase en voz alta antes de comprobar la respuesta.',
   'Look at the picture. Say the Spanish aloud before you reveal the answer.'
 );
 document.getElementById('practiceTitle').textContent=tr('5 · PRACTICA','5 · PRACTISE');
 document.getElementById('practiceHelp').textContent=tr(
   'Si fallas, no pasa nada: lee el recordatorio del porqué y vuelve a recuperar el patrón.',
   'If you make a mistake, read the short WHY reminder. The aim is to remember the pattern, not get a score.'
 );
 document.getElementById('aiTitle').textContent=tr('6 · HABLA CON TU PROFESOR DE IA','6 · TALK WITH YOUR AI TEACHER');
 document.getElementById('aiHelp').textContent=tr(
   'Este texto le dice a tu IA exactamente qué practicar contigo.',
   'This text tells your AI teacher exactly what to practise with you.'
 );
 document.getElementById('step1').innerHTML='<b>'+tr('Pulsa COPIAR TEXTO.','Tap COPY PRACTICE TEXT.')+'</b>';
 document.getElementById('step2').textContent=tr('Abre tu profesor de IA en el móvil o en el ordenador.','Open your AI teacher on your phone or computer.');
 document.getElementById('step3').textContent=tr('Pega el texto y empieza a hablar.','Paste the text and start talking.');
 document.getElementById('copyPrompt').textContent=tr('📋 COPIAR TEXTO DE PRÁCTICA','📋 COPY PRACTICE TEXT');
 document.getElementById('seePrompt').textContent=tr('Ver el texto que se copiará','See the text that will be copied');
 document.getElementById('feedbackTitle').textContent=tr('7 · CUÉNTANOS','7 · TELL US');
 document.getElementById('feedbackHelp').textContent=tr(
   'Esto nos ayuda a mejorar la siguiente lección. No hay respuestas correctas.',
   'This helps us improve the next lesson. There are no right or wrong answers.'
 );
 document.getElementById('fb1').textContent=tr('👍 Me ha ayudado','👍 This helped me');
 document.getElementById('fb2').textContent=tr('🤔 Necesito más ejemplos','🤔 I need more examples');
 document.getElementById('fb3').textContent=tr('❓ Sigo sin entender algo','❓ I still do not understand something');
 document.getElementById('freeHelp').textContent=tr('Opcional: escribe cualquier comentario.','Optional: tell us anything else.');
 document.getElementById('generalFeedback').placeholder=tr('Ej.: me acuerdo mejor con imágenes...','Example: I remember better when I can see an image...');
 document.getElementById('saveFeedback').textContent=tr('GUARDAR COMENTARIO','SAVE COMMENT');
 document.getElementById('creatorLabel').textContent=tr('Herramientas para quien prepara la lección','Tools for the lesson creator');
 document.getElementById('copyReport').textContent=tr('Copiar informe','Copy report');
 document.getElementById('exportReport').textContent=tr('Exportar informe','Export report');
 renderLearn();renderWhy();renderPhrases();renderSay();renderQuiz();renderPrompt();
}
function renderLearn(){
 const notes=(state().notes||{})[direction]||{};
 document.getElementById('learnList').innerHTML=D().core.map(x=>`
 <article class="learn-card">
  <div class="learn-top">
   <div class="icon">${x.icon}</div>
   <div class="target">${esc(x.target)}</div>
  </div>
  <button class="audio" onclick="playAudio('${esc(x.audio)}','a-${x.id}')">🔊 ${tr('ESCUCHAR','LISTEN')}</button>
  <div id="a-${x.id}" class="audio-status"></div>
  <button class="btn" onclick="toggle('meaning-${x.id}')" style="margin-top:8px">${tr('MOSTRAR SIGNIFICADO','SHOW MEANING')}</button>
  <div id="meaning-${x.id}" class="answer hidden">${esc(x.source)}</div>
  ${noteBlock('core_'+x.id, notes['core_'+x.id]||'')}
 </article>`).join('');
}
function renderWhy(){
 const w=D().why;
 document.getElementById('whyHeadline').textContent=w.headline;
 document.getElementById('whyIntro').textContent=w.intro;
 document.getElementById('families').innerHTML=w.families.map(f=>`
 <div class="family"><div><span class="family-icon">${f.icon}</span><span class="family-name">${esc(f.name)}</span></div><div>${esc(f.examples)}</div></div>`).join('');
 document.getElementById('whyRemember').textContent=w.remember;
 document.getElementById('moreTitle').textContent=w.more_title;
 document.getElementById('moreWhy').textContent=w.more;
}
function renderPhrases(){
 const notes=(state().notes||{})[direction]||{};
 document.getElementById('phraseList').innerHTML=D().phrases.map(x=>`
 <article class="phrase-card">
  <div style="font-size:42px">${x.icon}</div>
  <div class="phrase-target">${esc(x.target)}</div>
  <div class="phrase-source">${esc(x.source)}</div>
  <button class="audio" onclick="playAudio('${esc(x.audio)}','pa-${x.id}')">🔊 ${tr('ESCUCHAR','LISTEN')}</button>
  <div id="pa-${x.id}" class="audio-status"></div>
  ${x.memory?`<div class="memory">🧠 <b>${tr('Truco para recordar:','Memory trick:')}</b><br>${esc(x.memory.replace(/^Memory trick:\s*/,'').replace(/^Your own memory trick from today:\s*/,''))}</div>`:''}
  ${noteBlock('phrase_'+x.id, notes['phrase_'+x.id]||'')}
 </article>`).join('');
}
function noteBlock(id,value){
 return `<div class="note-block">
   <label class="note-label" for="note-${id}">✏️ ${tr('Mi nota / mi asociación','My note / my memory link')}</label>
   <textarea id="note-${id}" placeholder="${esc(tr('Ej.: esto me recuerda a… / hoy lo usamos cuando…','Example: this reminds me of… / we used this today when…'))}">${esc(value)}</textarea>
   <button class="btn" style="margin-top:7px" onclick="saveNote('${id}')">${tr('GUARDAR MI NOTA','SAVE MY NOTE')}</button>
   <div id="saved-${id}" class="saved"></div>
 </div>`;
}
function saveNote(id){
 const s=state(),n=s.notes||{};n[direction]=n[direction]||{};
 n[direction][id]=document.getElementById('note-'+id).value.trim();
 patch({notes:n});document.getElementById('saved-'+id).textContent=tr('✓ Guardada en este navegador','✓ Saved on this browser');
}
function renderSay(){
 document.getElementById('sayList').innerHTML=D().core.map((x,i)=>`
 <article class="learn-card say-card">
   <div class="say-icon">${x.icon}</div>
   <div class="section-help">${tr('Dilo en voz alta primero.','Say it aloud first.')}</div>
   <button class="btn primary" onclick="toggle('say-${i}')">${tr('MOSTRAR RESPUESTA','SHOW ANSWER')}</button>
   <div id="say-${i}" class="reveal hidden">${esc(x.target)}
     <button class="audio" onclick="playAudio('${esc(x.audio)}','sa-${i}')">🔊 ${tr('ESCUCHAR','LISTEN')}</button>
     <div id="sa-${i}" class="audio-status"></div>
   </div>
 </article>`).join('');
}
function renderQuiz(){
 document.getElementById('quiz').innerHTML=D().quiz.map((q,qi)=>`
 <div class="quizq">
  <div class="quizprompt">${qi+1}. ${esc(q.prompt)}</div>
  <div class="options">${q.options.map((o,oi)=>`<button id="op-${q.id}-${oi}" class="btn" onclick="answer('${q.id}',${oi})">${esc(o)}</button>`).join('')}</div>
  <div id="res-${q.id}"></div>
 </div>`).join('');
 renderScore();
}
function answer(id,choice){
 const q=D().quiz.find(x=>x.id===id),ok=choice===q.answer;answers[id]=choice;
 q.options.forEach((_,i)=>document.getElementById(`op-${id}-${i}`).classList.remove('good','bad'));
 document.getElementById(`op-${id}-${q.answer}`).classList.add('good');
 if(!ok)document.getElementById(`op-${id}-${choice}`).classList.add('bad');
 const r=document.getElementById('res-'+id);r.className='result '+(ok?'good':'bad');
 r.innerHTML=ok?`<strong>✅ ${tr('¡Correcto!','Correct!')}</strong><br>${esc(q.why)}`:
 `<strong>❌ ${tr('Casi.','Not quite.')}</strong><br>${tr('Correcta: ','Correct answer: ')}<b>${esc(q.options[q.answer])}</b><br>${esc(q.why)}`;
 const s=state(),a=s.attempts||{};a[direction]=a[direction]||{};
 const z=a[direction][id]||{tries:0,wrong:0,skill:q.skill};z.tries++;if(!ok)z.wrong++;
 a[direction][id]=z;patch({attempts:a});renderScore();renderPrompt();
}
function renderScore(){
 const q=D().quiz,done=Object.keys(answers).length,ok=q.filter(x=>answers[x.id]===x.answer).length;
 document.getElementById('score').innerHTML=done?`${ok}/${done}<div class="small muted">${tr('No es una nota: buscamos qué conviene repetir.','This is not a grade: we are finding what needs more practice.')}</div>`:'';
}
function weakSkills(){
 const a=(state().attempts||{})[direction]||{};
 return [...new Set(Object.values(a).filter(x=>x.wrong>0).map(x=>x.skill))];
}
function buildPrompt(){
 const lines=[...D().ai_rules],w=weakSkills();
 if(w.length){
  lines.push('',direction==='en_es'?'The website noticed that I need more practice with:':'La web ha detectado que necesito reforzar:');
  w.forEach(x=>lines.push('• '+x));
  lines.push(direction==='en_es'?'Please create extra opportunities to practise these points naturally.':'Crea oportunidades extra para practicar esos puntos de forma natural.');
 }
 return lines.join('\n');
}
function renderPrompt(){document.getElementById('prompt').textContent=buildPrompt()}
async function copyAIPrompt(){
 try{
  await navigator.clipboard.writeText(buildPrompt());
  const el=document.getElementById('copyStatus');el.className='copy-ok';
  el.textContent='✅ '+tr('Copiado. Ahora abre tu profesor de IA, pega el texto y empieza a hablar.','Copied. Now open your AI teacher, paste the text and start talking.');
 }catch(e){
  const el=document.getElementById('copyStatus');el.className='result bad';
  el.textContent=tr('No se pudo copiar automáticamente. Abre “Ver el texto” y cópialo manualmente.','Automatic copy did not work. Open “See the text” and copy it manually.');
 }
}
function rate(v){
 const s=state(),f=s.feedback||{};f[direction]=f[direction]||{};f[direction].rating=v;patch({feedback:f});
 document.getElementById('feedbackStatus').textContent=tr('✓ Guardado','✓ Saved');
}
function saveGeneralFeedback(){
 const s=state(),f=s.feedback||{};f[direction]=f[direction]||{};f[direction].freeText=document.getElementById('generalFeedback').value.trim();patch({feedback:f});
 document.getElementById('feedbackStatus').textContent=tr('✓ Comentario guardado','✓ Comment saved');
}
function report(){
 const s=state();return{report_type:'language_mirror_practice',course_id:C.course_id,version:C.version,direction,
 generated_at:new Date().toISOString(),attempts:(s.attempts||{})[direction]||{},notes:(s.notes||{})[direction]||{},
 feedback:(s.feedback||{})[direction]||{},detected_focus:weakSkills()};
}
async function copyReportData(){await navigator.clipboard.writeText(JSON.stringify(report(),null,2));document.getElementById('feedbackStatus').textContent=tr('✓ Informe copiado','✓ Report copied')}
function exportReportData(){const b=new Blob([JSON.stringify(report(),null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='language-mirror-report-'+direction+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function toggle(id){document.getElementById(id).classList.toggle('hidden')}
function playAudio(src,statusId){
 const s=document.getElementById(statusId),a=new Audio(src);s.textContent=tr('🔊 Reproduciendo…','🔊 Playing…');
 a.play().then(()=>{}).catch(()=>s.textContent=tr('No se pudo reproducir el audio.','The audio could not play.'));
 a.onended=()=>s.textContent='';
}
</script>
</body>
</html>
