<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Language Mirror</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf8;--text:#252823;--muted:#6c716d;--line:#d9d3c5;--accent:#3c695c;--soft:#eaf1ed;--blue:#edf3fa;--blue2:#cad9eb;--good:#e8f3e8;--goodline:#72977b;--bad:#faece9;--badline:#bd7768;--note:#fff7dc;--shadow:0 3px 13px rgba(0,0,0,.05)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:19px;line-height:1.45}
button,textarea{font:inherit}main{max-width:680px;margin:auto;padding:17px 13px 80px}h1{font-size:34px;line-height:1.05;margin:4px 0}h2{font-size:27px;line-height:1.15;margin:0 0 10px}h3{font-size:21px;margin:0 0 6px}.small{font-size:16px}.muted{color:var(--muted)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:19px;padding:17px;margin:13px 0;box-shadow:var(--shadow)}.btn{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px 14px;font-weight:780;text-align:left;cursor:pointer;white-space:normal}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.soft{background:var(--soft);border-color:#bfd3ca}.btn.good{background:var(--good);border-color:var(--goodline)}.btn.bad{background:var(--bad);border-color:var(--badline)}.btn.center{text-align:center}.btn.compact{width:auto;min-height:42px;padding:8px 11px}.hidden{display:none!important}
.header{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}.header-title{flex:1;user-select:none;-webkit-user-select:none}.eyebrow{font-size:14px;font-weight:850;letter-spacing:.06em;color:var(--muted)}.mode-badge{width:auto;min-height:42px;padding:7px 10px;font-size:14px;background:transparent}.section-label{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.07em;margin:24px 4px 7px}
.home-grid,.menu-list{display:grid;gap:9px}.home-btn{display:grid;grid-template-columns:42px minmax(0,1fr) 22px;gap:10px;align-items:center}.home-icon{font-size:30px;text-align:center}.arrow{font-size:23px;color:var(--muted)}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.back{width:auto;min-height:42px;padding:7px 11px}.spacer{flex:1}
.mission{background:linear-gradient(180deg,#fffdf8,#f8f5ed)}.mission-sub{color:var(--muted);margin-top:-3px}.group-title{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.06em;margin:19px 2px 7px}
.progress-wrap{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin:6px 0 13px}.progress{height:7px;border-radius:999px;background:#dcd7cb;overflow:hidden}.progress>div{height:100%;background:var(--accent)}.counter{font-size:15px;color:var(--muted);font-weight:800}
.flash{min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative}.help-row{position:absolute;top:13px;right:13px;display:flex;gap:7px}.mini-help{width:auto;min-height:42px;border-radius:12px;padding:7px 10px;text-align:center;font-size:15px;background:var(--blue);border:1.5px solid var(--blue2);font-weight:800}
.flash-icon{font-size:68px;line-height:1;text-align:center;margin:8px 0 14px}.flash-prompt{font-size:25px;line-height:1.27;font-weight:870;text-align:center;margin:6px 0 16px;overflow-wrap:anywhere}.flash-sub{font-size:17px;color:var(--muted);text-align:center;margin:-5px 0 14px}.answer{margin-top:12px;background:var(--soft);border-radius:15px;padding:14px;text-align:center;font-size:24px;font-weight:870;overflow-wrap:anywhere}.options{display:grid;gap:8px}.feedback{margin-top:12px;border-radius:14px;padding:13px;text-align:left;font-size:18px}.feedback.good{background:var(--good);border:1.5px solid var(--goodline)}.feedback.bad{background:var(--bad);border:1.5px solid var(--badline)}.audio{width:auto;min-height:44px;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:8px 13px;font-weight:800;cursor:pointer;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(31,34,31,.42);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modal{width:min(650px,100%);max-height:82vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 12px 50px rgba(0,0,0,.22)}.modal-close{float:right;width:44px;min-height:44px;text-align:center;padding:0}.modal h2{padding-right:50px}
.word-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}.word-chip{width:auto;min-height:46px;padding:9px 12px;border-radius:12px}.built-line{min-height:58px;border:1.5px dashed var(--line);border-radius:14px;padding:11px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center;align-items:center;margin:10px 0}
.match-grid{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:stretch}.match-left,.match-right{display:grid;gap:8px}.match-item{min-height:58px}.match-icon{font-size:32px;text-align:center}.selected{outline:3px solid var(--accent)}
.hunt-list{display:grid;gap:8px;margin:12px 0}.hunt-row{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:center}.check{font-size:22px}.found{color:var(--accent);font-weight:800}
.ref-item{border-top:1.5px solid var(--line);padding:13px 0}.ref-item:first-child{border-top:0}.ref-target{font-size:22px;font-weight:850}.ref-source{font-size:16px;color:var(--muted)}textarea{width:100%;min-height:95px;border:1.5px solid var(--line);border-radius:13px;padding:11px;background:white;color:var(--text);resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{width:auto;min-height:42px;padding:8px 11px}.note{background:var(--note);border-radius:13px;padding:10px;margin-top:9px;font-size:17px}
details summary{cursor:pointer;font-weight:780}
@media(min-width:760px){main{max-width:780px}.flash{min-height:455px}}
</style>
</head>
<body><main><div id="root"></div></main><div id="modalRoot"></div>
<script>
let C=null,route='home',activity=null,titleTaps=[],contextStack=[];
const KEY='language_mirror_v7';
let direction=localStorage.getItem('lm_v7_direction')||'en_es';

function S(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(p){localStorage.setItem(KEY,JSON.stringify(Object.assign(S(),p,{updatedAt:new Date().toISOString()})))}
function tr(es,en){return direction==='es_en'?es:en}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function D(topic='weather'){return C.topics[topic].directions[direction]}
function tTitle(id){const t=C.topics[id].title;return t[direction==='en_es'?'en':'es']}
function missionTitle(){return C.weekly_mission.title[direction==='en_es'?'en':'es']}
function missionSub(){return C.weekly_mission.subtitle[direction==='en_es'?'en':'es']}
function pushContext(label,fn){contextStack.push({label,fn})}
function back(){if(contextStack.length){let x=contextStack.pop();x.fn()}else{route='home';render()}}
function topbar(title){return `<div class="topbar"><button class="btn back" onclick="back()">←</button><b>${esc(title)}</b><span class="spacer"></span></div>`}
function header(){return `<div class="header"><div class="header-title" onclick="secretTap()"><div class="eyebrow">LANGUAGE MIRROR · PROTOTYPE 007</div><h1>Language Mirror</h1></div><button class="btn mode-badge" onclick="languageSettings()">${direction==='en_es'?'Learning Spanish':'Aprendo inglés'}</button></div>`}
function secretTap(){let n=Date.now();titleTaps=titleTaps.filter(x=>n-x<1400);titleTaps.push(n);if(titleTaps.length>=3){titleTaps=[];alert(tr('Class Mode remains available through ?class=1 in this prototype.','Class Mode remains available through ?class=1 in this prototype.'))}}
function languageSettings(){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="btn modal-close" onclick="closeModal()">×</button><h2>Language</h2><div class="menu-list"><button class="btn ${direction==='en_es'?'soft':''}" onclick="setDirection('en_es')">🇬🇧 I speak English · I’m learning Spanish</button><button class="btn ${direction==='es_en'?'soft':''}" onclick="setDirection('es_en')">🇪🇸 Hablo español · aprendo inglés</button></div></div></div>`}
function setDirection(d){direction=d;localStorage.setItem('lm_v7_direction',d);closeModal();contextStack=[];route='home';render()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

fetch('course.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{C=x;render()}).catch(e=>document.getElementById('root').innerHTML='<div class="card">Could not load course.json.</div>');

function render(){
 if(!C)return;
 document.documentElement.lang=direction==='en_es'?'en':'es';
 const map={home:renderHome,topic:renderTopicHub,explore:renderExplore,reference:renderReference,ai:renderAI,notes:renderNotes,games:renderGames};
 (map[route]||renderHome)();
}
function hb(icon,title,sub,onclick,primary=false){return `<button class="btn home-btn ${primary?'primary':''}" onclick="${onclick}"><span class="home-icon">${icon}</span><span><b>${esc(title)}</b><br><span class="small">${esc(sub)}</span></span><span class="arrow">›</span></button>`}

function renderHome(){
 contextStack=[];
 document.getElementById('root').innerHTML=`${header()}
 <div class="section-label">${tr('HOY','TODAY')}</div>
 <div class="home-grid">${hb('▶',tr('Sesión de hoy','Today’s session'),tr('Una sesión corta mezclando lo que más conviene','A short session mixing what is most useful'),"startToday()",true)}</div>
 <div class="section-label">${tr('ESTA SEMANA','THIS WEEK')}</div>
 <div class="home-grid">${hb('🌦️',missionTitle(),missionSub(),"openTopic('weather','home')")}</div>
 <div class="section-label">${tr('EXPLORAR','EXPLORE')}</div>
 <div class="home-grid">${hb('🗂️',tr('Explorar temas','Explore topics'),tr('Abre otros temas sin cambiar el plan semanal','Open other topics without changing the weekly plan'),"openExplore()")}</div>
 <details class="card" style="margin-top:29px"><summary>${tr('Ayudar a mejorar Language Mirror (opcional)','Help improve Language Mirror (optional)')}</summary><p class="small muted">${tr('No forma parte del estudio. Puedes ignorarlo.','This is not part of your study. You can ignore it.')}</p><textarea id="improveText" placeholder="${esc(tr('Comentario opcional…','Optional comment…'))}"></textarea><button class="btn soft center" onclick="saveImprovement()">${tr('GUARDAR','SAVE')}</button><div id="improveStatus" class="small muted"></div></details>`;
}
function saveImprovement(){let s=S(),f=s.improvement||{};f.text=document.getElementById('improveText').value.trim();save({improvement:f});document.getElementById('improveStatus').textContent=tr('Guardado.','Saved.')}

let currentTopic='weather';
function openTopic(id,from='home'){
 currentTopic=id;contextStack=[];
 if(from==='explore')pushContext('explore',()=>openExplore());
 else pushContext('home',()=>{route='home';render()});
 route='topic';renderTopicHub();
}
function renderTopicHub(){
 let d=D(currentTopic),isWeather=currentTopic==='weather';
 document.getElementById('root').innerHTML=`${header()}${topbar(tTitle(currentTopic))}
 <div class="card mission"><h2>${C.topics[currentTopic].icon} ${esc(isWeather?missionTitle():tTitle(currentTopic))}</h2>${isWeather?`<p class="mission-sub">${esc(missionSub())}</p>`:''}
 <button class="btn primary center" onclick="startLearning('learn','${currentTopic}')">${tr('EMPEZAR / CONTINUAR','START / CONTINUE')}</button></div>
 <div class="card"><div class="group-title">${tr('APRENDER','LEARN')}</div><div class="menu-list">
 ${hb('🪞',tr('Aprender','Learn'),tr('Tarjetas · audio · pista · por qué','Cards · audio · hint · why'),`startLearning('learn','${currentTopic}')`)}
 ${(d.phrases||[]).length?hb('💬',tr('Frases útiles','Useful phrases'),tr('Primero conocer, después producir','Meet them first, produce them later'),`startLearning('phrases','${currentTopic}')`):''}
 </div>
 <div class="group-title">${tr('USARLO','USE IT')}</div><div class="menu-list">
 ${hb('🧠',tr('Practicar','Practice'),tr('Elegir · construir · decir · recuperar','Choose · build · say · retrieve'),`practiceMenu('${currentTopic}')`)}
 ${isWeather?hb('🪟',tr('Conversación guiada','Guided conversation'),tr('La app crea la situación y la respuesta objetivo','The app controls the scene and target answer'),`startGuidedConversation('${currentTopic}')`):''}
 ${isWeather?hb('🗣️',tr('Hablar con IA','Talk with AI'),tr('Conversación contextual sobre este tema','Contextual conversation about this topic'),"openAI()"):''}
 </div>
 ${isWeather?`<div class="group-title">${tr('JUGAR / EXPLORAR','PLAY / EXPLORE')}</div><div class="menu-list">${hb('🎲',tr('Juegos','Games'),tr('Match · Phrase Hunt · Build · Look & Say'),"openGames()")}</div>`:''}
 <div class="group-title">${tr('PERSONAL / CONSULTA','PERSONAL / REFERENCE')}</div><div class="menu-list">
 ${hb('📝',tr('Mis notas','My notes'),tr('Notas y asociaciones de este tema','Notes and memory links for this topic'),"openNotes()")}
 ${hb('📖',tr('Ver todo','View everything'),tr('Consulta rápida de todo el tema','Quick reference for the whole topic'),"openReference()")}
 </div></div>`;
}

function openExplore(){contextStack=[];pushContext('home',()=>{route='home';render()});route='explore';renderExplore()}
function renderExplore(){
 const ids=Object.entries(C.topics).filter(([id,x])=>x.directions).map(([id])=>id);
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Explorar temas','Explore topics'))}<div class="card"><p>${tr('Explorar no cambia lo que toca esta semana.','Exploring does not change this week’s plan.')}</p><div class="menu-list">${ids.map(id=>hb(C.topics[id].icon,tTitle(id),id===C.current_topic?tr('Tema actual','Current topic'):tr('Disponible','Available'),`openTopic('${id}','explore')`)).join('')}</div></div>`;
}

function openReference(){pushContext('topic',()=>{route='topic';renderTopicHub()});route='reference';renderReference()}
function renderReference(){let d=D(currentTopic);document.getElementById('root').innerHTML=`${header()}${topbar(tr('Ver todo','View everything'))}<div class="card"><h2>${esc(tTitle(currentTopic))}</h2>${(d.learn||[]).map(x=>`<div class="ref-item"><div class="ref-target">${x.icon} ${esc(x.target)}</div><div class="ref-source">${esc(x.source)}</div></div>`).join('')}</div>${(d.phrases||[]).length?`<div class="card"><h2>${tr('Frases útiles','Useful phrases')}</h2>${d.phrases.map(x=>`<div class="ref-item"><div class="ref-target">${x.icon} ${esc(x.target)}</div><div class="ref-source">${esc(x.source)}</div></div>`).join('')}</div>`:''}`}

function openNotes(){pushContext('topic',()=>{route='topic';renderTopicHub()});route='notes';renderNotes()}
function renderNotes(){let rows=Object.entries(S().notes||{}).filter(([k,v])=>v&&k.startsWith(direction+'|'+currentTopic+'|'));document.getElementById('root').innerHTML=`${header()}${topbar(tr('Mis notas','My notes'))}<div class="card"><h2>📝 ${tr('Mis notas','My notes')}</h2>${rows.length?rows.map(([k,v])=>`<div class="ref-item">${esc(v)}</div>`).join(''):`<p>${tr('Todavía no hay notas en este tema.','There are no notes for this topic yet.')}</p>`}</div>`}

function openAI(){pushContext('topic',()=>{route='topic';renderTopicHub()});route='ai';renderAI()}
function renderAI(){let p=D(currentTopic).ai_prompt.join('\n');document.getElementById('root').innerHTML=`${header()}${topbar(tr('Hablar con IA','Talk with AI'))}<div class="card"><h2>🗣️ ${tr('Práctica conversacional','Conversation practice')}</h2><p>${tr('Copia este texto y pégalo en tu profesor de IA.','Copy this text and paste it into your AI teacher.')}</p><button class="btn primary center" onclick='copyText(${JSON.stringify(p)})'>📋 ${tr('COPIAR','COPY')}</button></div>`}

function showInfo(title,body){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="btn modal-close" onclick="closeModal()">×</button><h2>${esc(title)}</h2><p>${esc(body)}</p></div></div>`}
function helpButtons(data){
 const hint=data.hint||tr('Piensa primero en el patrón.','Think about the pattern first.');
 const why=data.why||tr('Esta actividad practica una forma útil de expresar esta situación.','This activity practises a useful way to express this situation.');
 const wt=data.why_title||tr('¿POR QUÉ?','WHY?');
 return `<div class="help-row"><button class="mini-help" onclick='showInfo(${JSON.stringify(tr("PISTA","HINT"))},${JSON.stringify(hint)})'>💡 ${tr('PISTA','HINT')}</button><button class="mini-help" onclick='showInfo(${JSON.stringify(wt)},${JSON.stringify(why)})'>${tr('¿POR QUÉ?','WHY?')}</button></div>`;
}

function noteUI(topic,id){let k=direction+'|'+topic+'|'+id,n=(S().notes||{})[k]||'';let sid=k.replace(/[^a-zA-Z0-9]/g,'_');return `<details style="margin-top:11px"><summary>✏️ ${tr('Mi nota','My note')}</summary><textarea id="note_${sid}" placeholder="${esc(tr('Esto me recuerda a…','This reminds me of…'))}">${esc(n)}</textarea><button class="btn soft center" onclick="saveNote('${esc(k)}')">${tr('GUARDAR','SAVE')}</button></details>`}
function saveNote(k){let s=S(),n=s.notes||{},sid=k.replace(/[^a-zA-Z0-9]/g,'_');n[k]=document.getElementById('note_'+sid).value.trim();save({notes:n})}

function startLearning(kind,topic){
 currentTopic=topic;let d=D(topic),items=[];
 if(kind==='learn')items=(d.learn||[]).map(x=>({type:'learn',topic,data:x}));
 if(kind==='phrases')items=(d.phrases||[]).map(x=>({type:'phrase',topic,data:x}));
 let k=direction+'|'+topic+'|'+kind,idx=(S().sectionProgress||{})[k]||0;
 pushContext('topic',()=>{route='topic';renderTopicHub()});
 activity={kind,topic,items,index:Math.min(idx,Math.max(0,items.length-1)),answered:false,results:[]};renderActivity();
}
function startGuidedConversation(topic){
 currentTopic=topic;
 let items=(D(topic).guided_conversation||[]).map(x=>({type:'guided',topic,data:x}));
 pushContext('topic',()=>{route='topic';renderTopicHub()});
 activity={kind:'guided',topic,items,index:0,answered:false,results:[]};renderActivity();
}
function startBuild(topic){
 currentTopic=topic;
 let items=(D(topic).build_pool||[]).map(x=>({type:'build',topic,data:x,chosen:[]}));
 pushContext('games',()=>{route='games';renderGames()});
 activity={kind:'build',topic,items,index:0,answered:false,results:[]};renderActivity();
}

function activityTitle(){let m={learn:tr('Aprender','Learn'),phrases:tr('Frases útiles','Useful phrases'),practice:tr('Práctica','Practice'),guided:tr('Conversación guiada','Guided conversation'),build:tr('Construye la frase','Build the sentence'),looksay:tr('Mira y di','Look & say')};return m[activity.kind]||tr('Actividad','Activity')}
function renderActivity(){
 if(activity.index>=activity.items.length){renderEnd();return}
 let e=activity.items[activity.index],pct=activity.index/activity.items.length*100;
 document.getElementById('root').innerHTML=`${header()}${topbar(activityTitle())}<div class="progress-wrap"><div class="progress"><div style="width:${pct}%"></div></div><div class="counter">${activity.index+1} / ${activity.items.length}</div></div><div class="card flash">${cardHtml(e)}</div>`;
}
function cardHtml(e){
 if(e.type==='learn'||e.type==='phrase'){
  let x=e.data;
  return `${helpButtons(x)}<div class="flash-icon">${x.icon||'💬'}</div><div class="flash-prompt">${esc(x.target)}</div><div class="flash-sub">${tr('Intenta recordar el significado antes de mostrarlo.','Try to remember the meaning before revealing it.')}</div>${x.audio?`<button class="audio" onclick="play('${esc(x.audio)}')">🔊 ${tr('Escuchar','Listen')}</button>`:''}<button class="btn primary center" style="margin-top:12px" onclick="revealLearn()">${tr('MOSTRAR SIGNIFICADO','SHOW MEANING')}</button><div id="reveal"></div>`;
 }
 if(e.type==='guided'){
  let x=e.data;
  return `${helpButtons(x)}<div class="flash-icon">${x.icon}</div><div class="flash-sub">${esc(x.scene)}</div><div class="flash-prompt">${esc(x.speaker)}</div><p style="text-align:center">${esc(x.prompt)}</p><button class="btn primary center" onclick="revealGuided()">${tr('MOSTRAR RESPUESTA','SHOW ANSWER')}</button><div id="reveal"></div>`;
 }
 if(e.type==='build'){
  let x=e.data;
  return `${helpButtons(x)}<div class="flash-icon">${x.icon}</div><div class="flash-prompt">${esc(x.prompt)}</div><div class="built-line" id="builtLine">${(e.chosen||[]).map((w,i)=>`<button class="btn word-chip soft" onclick="unchooseWord(${i})">${esc(w)}</button>`).join('')}</div><div class="word-bank">${x.words.map((w,i)=>`<button class="btn word-chip" onclick="chooseWord(${i})">${esc(w)}</button>`).join('')}</div><button class="btn primary center" onclick="checkBuild()">${tr('COMPROBAR','CHECK')}</button><div id="reveal"></div>`;
 }
 if(e.type==='practice')return practiceCard(e);
 if(e.type==='looksay'){
  let x=e.data;
  return `${helpButtons(x)}<div class="flash-icon">${x.icon}</div><div class="flash-prompt">${esc(x.prompt)}</div><button class="btn primary center" onclick="revealLookSay()">${tr('MOSTRAR RESPUESTA','SHOW ANSWER')}</button><div id="reveal"></div>`;
 }
}
function revealLearn(){let e=activity.items[activity.index],x=e.data;document.getElementById('reveal').innerHTML=`<div class="answer">${esc(x.source)}</div>${x.memory?`<div class="note">🧠 ${esc(x.memory)}</div>`:''}${noteUI(e.topic,(e.type==='phrase'?'phrase_':'')+x.id)}${nextBtn()}`}
function revealGuided(){let e=activity.items[activity.index],x=e.data;document.getElementById('reveal').innerHTML=`<div class="answer">${esc(x.answer)}</div><div class="chips" style="margin-top:12px"><button class="btn chip good" onclick="guidedGrade(true)">${tr('Me salió','I could say it')}</button><button class="btn chip bad" onclick="guidedGrade(false)">${tr('No me salió','I couldn’t say it')}</button></div>`}
function guidedGrade(ok){let e=activity.items[activity.index],x=e.data;gradeSimple(e.topic,x,ok);if(!ok)document.getElementById('reveal').insertAdjacentHTML('beforeend',`<div class="feedback bad"><b>${tr('Recuerda','Remember')}:</b> ${esc(x.why)}</div>`);document.querySelector('#reveal .chips')?.remove();document.getElementById('reveal').insertAdjacentHTML('beforeend',nextBtn())}
function chooseWord(i){let e=activity.items[activity.index],w=e.data.words[i];e.chosen=e.chosen||[];e.chosen.push(w);renderActivity()}
function unchooseWord(i){let e=activity.items[activity.index];e.chosen.splice(i,1);renderActivity()}
function checkBuild(){let e=activity.items[activity.index],x=e.data,ok=JSON.stringify(e.chosen||[])===JSON.stringify(x.answer);gradeSimple(e.topic,x,ok);document.getElementById('reveal').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ '+tr('Correcto','Correct'):'✗ '+tr('Prueba otra vez','Try again')}</b><br>${ok?esc(x.why):esc(x.hint)}</div>${ok?nextBtn():''}`;if(!ok)e.chosen=[]}
function revealLookSay(){let e=activity.items[activity.index],x=e.data;document.getElementById('reveal').innerHTML=`<div class="answer">${esc(x.answer_text)}</div><div class="chips" style="margin-top:12px"><button class="btn chip good" onclick="lookGrade(true)">${tr('Me salió','I could say it')}</button><button class="btn chip bad" onclick="lookGrade(false)">${tr('No me salió','I couldn’t say it')}</button></div>`}
function lookGrade(ok){let e=activity.items[activity.index],x=e.data;gradeSimple(e.topic,x,ok);if(!ok)document.getElementById('reveal').insertAdjacentHTML('beforeend',`<div class="feedback bad"><b>${tr('Recuerda','Remember')}:</b> ${esc(x.why)}</div>`);document.querySelector('#reveal .chips')?.remove();document.getElementById('reveal').insertAdjacentHTML('beforeend',nextBtn())}
function nextBtn(){return `<button class="btn primary center" style="margin-top:12px" onclick="nextCard()">${tr('SIGUIENTE','NEXT')} →</button>`}
function nextCard(){activity.index++;activity.answered=false;renderActivity()}

function gradeSimple(topic,item,ok){let s=S(),st=s.skillStats||{},k=direction+'|'+topic+'|'+(item.skill||item.id||'misc'),z=st[k]||{correct:0,wrong:0};if(ok)z.correct++;else z.wrong++;st[k]=z;save({skillStats:st})}

function practiceMenu(topic){
 currentTopic=topic;
 pushContext('topic',()=>{route='topic';renderTopicHub()});
 let d=D(topic);
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Practicar','Practice'))}<div class="card"><div class="menu-list">
 ${hb('▶',tr('Recomendado','Recommended'),tr('Mezcla de ejercicios según progreso','A mix chosen from your progress'),`startPractice('recommended','${topic}')`,true)}
 ${hb('🧠',tr('Mis difíciles','My tricky ones'),tr('Lo que ha costado más','What has been difficult'),`startPractice('tricky','${topic}')`)}
 ${hb('🔀',tr('Aleatorio','Random'),tr('Una mezcla libre','A free mix'),`startPractice('random','${topic}')`)}
 ${hb('🧩',tr('Construye frases','Build sentences'),tr('Toca palabras en el orden correcto','Tap words in the right order'),`startBuild('${topic}')`)}
 </div></div>`;
}
function buildPracticeItems(mode,topic){
 let d=D(topic),base=(d.practice_pool||[]).map(x=>({type:'practice',topic,item:x}));
 let build=(d.build_pool||[]).map(x=>({type:'build',topic,data:x,chosen:[]}));
 let guided=(d.guided_conversation||[]).map(x=>({type:'guided',topic,data:x}));
 let all=[...base,...build,...guided];
 if(mode==='random')all.sort(()=>Math.random()-.5);
 if(mode==='tricky'){
  let st=S().skillStats||{};
  all=all.filter(e=>{let x=e.item||e.data,k=direction+'|'+topic+'|'+(x.skill||x.id||'misc'),z=st[k]||{wrong:0};return z.wrong>0});
  if(!all.length)all=[...base,...build].sort(()=>Math.random()-.5);
 }
 if(mode==='recommended'){
  // a gentle difficulty wave: recognition -> build -> recall/use -> guided conversation
  let mc=base.filter(e=>e.item.type==='mc');
  let recall=base.filter(e=>['recall','fix'].includes(e.item.type));
  let real=base.filter(e=>e.item.type==='real');
  all=[...mc.slice(0,2),...build.slice(0,2),...recall.slice(0,2),...guided.slice(0,2),...real.slice(0,1)];
 }
 return all.slice(0,10);
}
function startPractice(mode,topic){
 activity={kind:'practice',topic,items:buildPracticeItems(mode,topic),index:0,answered:false,results:[]};renderActivity()
}
function practiceCard(e){
 let i=e.item;
 if(i.type==='mc')return `${helpButtons(i)}<div class="flash-icon">${i.icon||'💬'}</div><div class="flash-prompt">${esc(i.prompt)}</div><div class="options">${i.options.map((o,n)=>`<button class="btn center" id="op${n}" onclick="answerMC(${n})">${esc(o)}</button>`).join('')}</div><div id="reveal"></div>`;
 if(i.type==='recall'||i.type==='fix')return `${helpButtons(i)}<div class="flash-icon">${i.icon||'💬'}</div><div class="flash-prompt">${esc(i.prompt)}</div><button class="btn primary center" onclick="revealPracticeRecall()">${tr('MOSTRAR RESPUESTA','SHOW ANSWER')}</button><div id="reveal"></div>`;
 return `${helpButtons(i)}<div class="flash-icon">${i.icon||'💬'}</div><div class="flash-prompt">${esc(i.prompt)}</div><button class="btn primary center" onclick="revealPracticeReal()">${tr('VER EJEMPLOS','SEE EXAMPLES')}</button><div id="reveal"></div>`;
}
function answerMC(n){let e=activity.items[activity.index],i=e.item,ok=n===i.answer;gradeSimple(e.topic,i,ok);document.getElementById('op'+i.answer).classList.add('good');if(!ok)document.getElementById('op'+n).classList.add('bad');document.getElementById('reveal').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ '+tr('Correcto','Correct'):'✗ '+tr('Casi','Not quite')}</b><br>${esc(i.why)}</div>${nextBtn()}`}
function revealPracticeRecall(){let e=activity.items[activity.index],i=e.item;document.getElementById('reveal').innerHTML=`<div class="answer">${esc(i.answer_text)}</div><div class="chips" style="margin-top:12px"><button class="btn chip good" onclick="practiceSelfGrade(true)">${tr('Me salió','I could say it')}</button><button class="btn chip bad" onclick="practiceSelfGrade(false)">${tr('No me salió','I couldn’t say it')}</button></div>`}
function practiceSelfGrade(ok){let e=activity.items[activity.index],i=e.item;gradeSimple(e.topic,i,ok);if(!ok)document.getElementById('reveal').insertAdjacentHTML('beforeend',`<div class="feedback bad">${esc(i.why)}</div>`);document.querySelector('#reveal .chips')?.remove();document.getElementById('reveal').insertAdjacentHTML('beforeend',nextBtn())}
function revealPracticeReal(){let e=activity.items[activity.index],i=e.item;document.getElementById('reveal').innerHTML=`<div class="feedback good">${(i.examples||[]).map(esc).join('<br>')}</div>${nextBtn()}`}

function startToday(){
 currentTopic=C.current_topic;
 pushContext('home',()=>{route='home';render()});
 let d=D(currentTopic),items=[];
 // 10-12 interactions: new/current + phrase + build + recall + guided + error-prone
 let learn=d.learn||[],phr=d.phrases||[],practice=d.practice_pool||[],build=d.build_pool||[],guided=d.guided_conversation||[];
 if(learn[0])items.push({type:'learn',topic:currentTopic,data:learn[0]});
 if(practice[0])items.push({type:'practice',topic:currentTopic,item:practice[0]});
 if(phr[0])items.push({type:'phrase',topic:currentTopic,data:phr[0]});
 if(build[0])items.push({type:'build',topic:currentTopic,data:build[0],chosen:[]});
 if(practice[1])items.push({type:'practice',topic:currentTopic,item:practice[1]});
 if(guided[0])items.push({type:'guided',topic:currentTopic,data:guided[0]});
 if(practice[2])items.push({type:'practice',topic:currentTopic,item:practice[2]});
 if(build[1])items.push({type:'build',topic:currentTopic,data:build[1],chosen:[]});
 if(phr[1])items.push({type:'phrase',topic:currentTopic,data:phr[1]});
 if(guided[1])items.push({type:'guided',topic:currentTopic,data:guided[1]});
 let recall=practice.find(x=>x.type==='recall'); if(recall)items.push({type:'practice',topic:currentTopic,item:recall});
 let real=practice.find(x=>x.type==='real'); if(real)items.push({type:'practice',topic:currentTopic,item:real});
 activity={kind:'practice',topic:currentTopic,items:items.slice(0,12),index:0,answered:false,results:[]};renderActivity()
}

function openGames(){pushContext('topic',()=>{route='topic';renderTopicHub()});route='games';renderGames()}
function renderGames(){
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Juegos','Games'))}<div class="card"><h2>🎲 ${tr('Juegos','Games')}</h2><p>${tr('Formas distintas de usar el mismo idioma. No cambian tu progreso.','Different ways to use the same language. They do not change your progress.')}</p><div class="menu-list">
 ${hb('🔗',tr('Enlaza','Match'),tr('Todo visible: frase ↔ imagen','Everything visible: phrase ↔ image'),"startMatch()",true)}
 ${hb('🔎',tr('Busca la frase','Phrase Hunt'),tr('Encuentra frases completas, con pistas y respuestas','Find full phrases, with hints and answers'),"startPhraseHunt()")}
 ${hb('🧩',tr('Construye la frase','Build the sentence'),tr('Ordena las palabras tocándolas','Order the words by tapping'),`startBuild('${currentTopic}')`)}
 ${hb('👀',tr('Mira y di','Look & say'),tr('Imagen → dilo → comprueba + WHY','Image → say it → check + WHY'),"startLookSay()")}
 </div></div>`;
}

let matchState=null;
function startMatch(){matchState={left:null,right:null,done:[]};renderMatch()}
function renderMatch(){
 let pool=D(currentTopic).match_pool||[];
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Enlaza','Match'))}<div class="card"><h2>🔗 ${tr('Enlaza frase e imagen','Match phrase and image')}</h2><p>${tr('Todo está visible. Elige una frase y después su imagen.','Everything is visible. Choose a phrase, then its image.')}</p><div class="match-grid"><div class="match-left">${pool.map((x,i)=>`<button class="btn match-item ${matchState.left===i?'selected':''} ${matchState.done.includes(i)?'good':''}" onclick="pickLeft(${i})">${esc(x.left)}</button>`).join('')}</div><div class="match-right">${pool.map((x,i)=>`<button class="btn match-item match-icon ${matchState.right===i?'selected':''}" onclick="pickRight(${i})">${x.right}</button>`).join('')}</div></div><div id="matchFeedback"></div></div>`;
}
function pickLeft(i){if(matchState.done.includes(i))return;matchState.left=i;tryMatch();renderMatch()}
function pickRight(i){matchState.right=i;tryMatch();renderMatch()}
function tryMatch(){if(matchState.left===null||matchState.right===null)return;let ok=matchState.left===matchState.right,idx=matchState.left,pool=D(currentTopic).match_pool;if(ok){matchState.done.push(idx);setTimeout(()=>showInfo(tr('Correcto','Correct'),pool[idx].why),50)}else{setTimeout(()=>showInfo(tr('Prueba otra vez','Try again'),pool[idx].hint),50)}matchState.left=null;matchState.right=null}

function startLookSay(){
 let pool=(D(currentTopic).learn||[]).slice(0,6).map(x=>({type:'looksay',topic:currentTopic,data:{id:'ls_'+x.id,icon:x.icon,prompt:direction==='en_es'?'Say this in Spanish.':'Di esto en inglés.',answer_text:x.target,hint:x.hint,why:x.why,why_title:x.why_title,skill:'look_'+x.id}}));
 pushContext('games',()=>{route='games';renderGames()});activity={kind:'looksay',topic:currentTopic,items:pool,index:0,answered:false,results:[]};renderActivity()
}

let huntState=null;
function startPhraseHunt(){let phrases=D(currentTopic).phrase_hunt||[];huntState={phrases,found:[]};renderPhraseHunt()}
function renderPhraseHunt(){
 let p=huntState.phrases;
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Busca la frase','Phrase Hunt'))}<div class="card"><h2>🔎 ${tr('Busca las frases','Find the phrases')}</h2><p>${tr('Aquí reforzamos expresiones completas, no palabras sueltas.','Here we reinforce complete expressions, not isolated words.')}</p><div class="hunt-list">${p.map((x,i)=>`<div class="hunt-row"><span class="check">${huntState.found.includes(i)?'✓':'○'}</span><button class="btn ${huntState.found.includes(i)?'good':''}" onclick="markFound(${i})">${esc(x)}</button></div>`).join('')}</div><div class="chips"><button class="btn chip" onclick="huntHint()">💡 ${tr('PISTA','HINT')}</button><button class="btn chip" onclick="huntAnswers()">${tr('VER RESPUESTAS','SHOW ANSWERS')}</button></div><p class="small muted">${huntState.found.length} / ${p.length} ${tr('encontradas','found')}</p></div>`;
}
function markFound(i){if(!huntState.found.includes(i))huntState.found.push(i);renderPhraseHunt()}
function huntHint(){let i=huntState.phrases.findIndex((x,idx)=>!huntState.found.includes(idx));if(i>=0)showInfo(tr('PISTA','HINT'),tr('Busca primero la palabra que identifica la familia: HACE / ESTÁ / IT’S.','Start by looking for the word that identifies the pattern: HACE / ESTÁ / IT’S.'))}
function huntAnswers(){showInfo(tr('RESPUESTAS','ANSWERS'),huntState.phrases.join(' · '))}

function renderEnd(){document.getElementById('root').innerHTML=`${header()}${topbar(tr('Terminado','Finished'))}<div class="card"><h2>${tr('Sesión terminada','Session complete')}</h2><p>${tr('Lo importante volverá más adelante según cómo te haya ido.','Important material will return later depending on how it went.')}</p><button class="btn primary center" onclick="startToday()">${tr('SEGUIR PRACTICANDO','KEEP PRACTISING')}</button><button class="btn center" style="margin-top:8px" onclick="back()">${tr('VOLVER','BACK')}</button></div>`}

function play(src){new Audio(src).play().catch(()=>alert(tr('No se pudo reproducir el audio.','The audio could not play.')))}
function copyText(x){navigator.clipboard.writeText(x).then(()=>alert(tr('Copiado.','Copied.'))).catch(()=>prompt(tr('Copia este texto:','Copy this text:'),x))}
</script></body></html>
