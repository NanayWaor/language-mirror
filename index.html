<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Language Mirror</title>
<style>
:root{
 --bg:#f4f1e8;--card:#fffdf8;--text:#252823;--muted:#6b716c;--line:#d8d3c6;
 --accent:#3b6b5d;--soft:#e9f1ed;--blue:#edf3fb;--blue2:#d7e3f4;
 --good:#e8f3e8;--goodline:#71957a;--bad:#faece9;--badline:#bd7668;
 --note:#fff7dc;--shadow:0 3px 13px rgba(0,0,0,.055)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:19px;line-height:1.45}
button,textarea,select{font:inherit}
main{max-width:680px;margin:auto;padding:17px 13px 76px}
h1{font-size:34px;line-height:1.05;margin:5px 0 4px}
h2{font-size:27px;line-height:1.15;margin:0 0 11px}
h3{font-size:22px;line-height:1.2;margin:0 0 8px}
.small{font-size:16px}.muted{color:var(--muted)}
.eyebrow{font-size:14px;font-weight:850;letter-spacing:.06em;color:var(--muted)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:19px;padding:17px;margin:13px 0;box-shadow:var(--shadow)}
.btn{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px 14px;font-weight:780;text-align:left;cursor:pointer;white-space:normal}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.soft{background:var(--soft);border-color:#bfd3cb}
.btn.good{background:var(--good);border-color:var(--goodline)}
.btn.bad{background:var(--bad);border-color:var(--badline)}
.btn.center{text-align:center}
.btn.compact{width:auto;min-height:42px;padding:8px 11px}
.hidden{display:none!important}
.header{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.header-title{flex:1;user-select:none;-webkit-user-select:none}
.direction{width:auto;min-height:42px;padding:8px 10px;font-size:14px}
.section-label{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.07em;margin:25px 4px 7px}
.home-grid{display:grid;gap:9px}
.home-btn{display:grid;grid-template-columns:42px minmax(0,1fr) 22px;gap:10px;align-items:center}
.home-icon{font-size:30px;text-align:center}.arrow{font-size:24px;color:var(--muted)}
.info-card{background:transparent;border:1.5px dashed var(--line);border-radius:16px;padding:13px 15px;color:var(--muted)}
details summary{cursor:pointer;font-weight:780}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:13px}.back{width:auto;min-height:42px;padding:7px 11px}.spacer{flex:1}
.progress-wrap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:7px 0 14px}
.progress{height:7px;border-radius:999px;background:#dcd7cb;overflow:hidden}.progress>div{height:100%;background:var(--accent)}
.counter{font-size:15px;color:var(--muted);font-weight:800}
.flash{min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
.help-btn{position:absolute;top:13px;right:13px;width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;text-align:center;font-size:21px;background:var(--blue);border-color:var(--blue2)}
.flash-icon{font-size:70px;line-height:1;text-align:center;margin:8px 0 14px}
.flash-prompt{font-size:25px;line-height:1.26;font-weight:870;text-align:center;margin:7px 0 16px;overflow-wrap:anywhere}
.flash-sub{font-size:17px;color:var(--muted);text-align:center;margin:-5px 0 14px}
.answer{margin-top:12px;background:var(--soft);border-radius:15px;padding:14px;text-align:center;font-size:25px;font-weight:880;overflow-wrap:anywhere}
.options{display:grid;gap:8px}
.feedback{margin-top:12px;border-radius:14px;padding:13px;text-align:left;font-size:18px}
.feedback.good{background:var(--good);border:1.5px solid var(--goodline)}
.feedback.bad{background:var(--bad);border:1.5px solid var(--badline)}
.audio{width:auto;min-height:45px;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:8px 13px;font-weight:800;cursor:pointer;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(31,34,31,.42);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
.modal{width:min(650px,100%);max-height:82vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 12px 50px rgba(0,0,0,.22)}
.modal h2{padding-right:45px}.modal-close{float:right;width:44px;min-height:44px;text-align:center;padding:0}
.family{background:white;border:1.5px solid var(--blue2);border-radius:13px;padding:10px;margin:7px 0}
.note{background:var(--note);border-radius:13px;padding:11px;margin:9px 0;font-size:17px}
.menu-list{display:grid;gap:9px}
.topic-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.topic-icon{font-size:32px;text-align:center}
.topic-title{font-weight:850}
.ref-item{border-top:1.5px solid var(--line);padding:13px 0}.ref-item:first-child{border-top:0}
.ref-target{font-size:23px;font-weight:850}.ref-source{font-size:16px;color:var(--muted)}
textarea{width:100%;min-height:100px;border:1.5px solid var(--line);border-radius:13px;padding:11px;background:white;color:var(--text);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{width:auto;min-height:42px;padding:8px 11px}
.scoreline{font-size:16px;color:var(--muted);margin-top:8px}
.class-card{min-height:430px;display:flex;flex-direction:column;justify-content:center}
.class-main{font-size:27px;font-weight:880;line-height:1.24;margin:10px 0}.class-instruction{font-size:16px;color:var(--muted)}
@media(min-width:760px){main{max-width:780px}.home-grid.two{grid-template-columns:1fr 1fr}.flash{min-height:450px}}
</style>
</head>
<body>
<main><div id="root"></div></main>
<div id="modalRoot"></div>
<script>
let C=null;
const KEY='language_mirror_v4';
let direction=localStorage.getItem('lm_v4_direction')||'en_es';
let route='home';
let activity=null;
let titleTaps=[];

function S(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(p){localStorage.setItem(KEY,JSON.stringify(Object.assign(S(),p,{updatedAt:new Date().toISOString()})))}
function tr(es,en){return direction==='es_en'?es:en}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(s){return String(s).replace(/[^a-zA-Z0-9]/g,'_')}
function tTitle(id){const x=C.topics[id].title;return x[direction==='en_es'?'en':'es']}
function D(topic='weather'){return C.topics[topic].directions[direction]}
function go(r){route=r;activity=null;closeModal();scrollTo(0,0);render()}
function header(){
 return `<div class="header">
   <div class="header-title" onclick="secretTap()"><div class="eyebrow">LANGUAGE MIRROR · PROTOTYPE 004</div><h1>Language Mirror</h1></div>
   <button class="btn direction" onclick="switchDirection()">${direction==='en_es'?'EN → ES':'ES → EN'}</button>
 </div>`;
}
function topbar(title){
 return `<div class="topbar"><button class="btn back" onclick="go('home')">←</button><b>${esc(title)}</b><span class="spacer"></span></div>`;
}
function secretTap(){
 const now=Date.now();titleTaps=titleTaps.filter(x=>now-x<1400);titleTaps.push(now);
 if(titleTaps.length>=3){titleTaps=[];route='class';render();}
}
function switchDirection(){
 direction=direction==='en_es'?'es_en':'en_es';localStorage.setItem('lm_v4_direction',direction);activity=null;render();
}

fetch('course.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(x=>{
 C=x;
 const q=new URLSearchParams(location.search);if(q.get('class')==='1')route='class';
 render();
}).catch(e=>document.getElementById('root').innerHTML='<div class="card">Could not load course.json.</div>');

function render(){
 if(!C)return;
 document.documentElement.lang=direction==='en_es'?'en':'es';
 const routes={home:renderHome,today:()=>openPractice('recommended'),week:renderWeek,tricky:renderTricky,games:renderGames,explore:renderExplore,notes:renderNotes,ai:renderAI,class:renderClass,reference:renderReference};
 (routes[route]||renderHome)();
}
function homeButton(icon,title,sub,onclick,primary=false){
 return `<button class="btn home-btn ${primary?'primary':''}" onclick="${onclick}"><span class="home-icon">${icon}</span><span><b>${esc(title)}</b><br><span class="small">${esc(sub)}</span></span><span class="arrow">›</span></button>`;
}
function renderHome(){
 const next=C.next_week?.label?.[direction==='en_es'?'en':'es'];
 document.getElementById('root').innerHTML=`
 ${header()}
 <div class="section-label">${tr('HOY','TODAY')}</div>
 <div class="home-grid">${homeButton('▶',tr('Práctica de hoy','Today’s practice'),tr('Unos 7 minutos · puedes repetir cuando quieras','About 7 minutes · repeat whenever you want'),"openPractice('recommended')",true)}</div>

 <div class="section-label">${tr('ESTA SEMANA','THIS WEEK')}</div>
 <div class="home-grid">${homeButton('🌦️',tTitle('weather'),tr('Aprende · frases · practica · conversación real','Learn · phrases · practice · real-life conversation'),"go('week')")}</div>

 ${next?`<div class="section-label">${tr('PRÓXIMA SEMANA','NEXT WEEK')}</div><div class="info-card">${esc(next)}</div>`:''}

 <div class="section-label">${tr('MÁS PRÁCTICA','MORE PRACTICE')}</div>
 <div class="home-grid two">
  ${homeButton('🧠',tr('Mis difíciles','My tricky ones'),tr('Repaso según tus errores y tiempo','Review based on errors and time'),"go('tricky')")}
  ${homeButton('🎲',tr('Jugar y repasar','Play & review'),tr('Actividades tranquilas con lo ya aprendido','Calm activities using what you know'),"go('games')")}
  ${homeButton('🗣️',tr('Hablar con IA','Talk with AI'),tr('Conversación guiada','Guided conversation'),"go('ai')")}
  ${homeButton('📝',tr('Mis notas','My notes'),tr('Tus asociaciones y recuerdos','Your memory links'),"go('notes')")}
 </div>

 <div class="section-label">${tr('EXPLORAR','EXPLORE')}</div>
 <div class="home-grid">${homeButton('🗂️',tr('Explorar temas','Explore topics'),tr('Practica libremente otros temas disponibles','Freely practise other available topics'),"go('explore')")}</div>

 <details class="card" style="margin-top:28px">
  <summary>${tr('Ayudar a mejorar Language Mirror (opcional)','Help improve Language Mirror (optional)')}</summary>
  <p class="small muted">${tr('Solo si te apetece. Puedes ignorar completamente esta parte.','Only if you feel like it. You can completely ignore this.')}</p>
  <div class="chips">
   <button class="btn chip" onclick="feedbackTag('clear')">👍 ${tr('Claro','Clear')}</button>
   <button class="btn chip" onclick="feedbackTag('examples')">🤔 ${tr('Más ejemplos','More examples')}</button>
   <button class="btn chip" onclick="feedbackTag('confusing')">❓ ${tr('Algo confunde','Something is confusing')}</button>
  </div>
  <textarea id="improveText" placeholder="${esc(tr('Algo que cambiarías, quitarías o añadirías…','Anything you would change, remove or add…'))}"></textarea>
  <button class="btn soft center" onclick="saveImprovement()">${tr('GUARDAR COMENTARIO','SAVE COMMENT')}</button>
  <div id="improveStatus" class="small muted"></div>
 </details>`;
}
function feedbackTag(tag){const s=S(),f=s.improvement||{};f.tag=tag;save({improvement:f});document.getElementById('improveStatus').textContent=tr('Guardado.','Saved.')}
function saveImprovement(){const s=S(),f=s.improvement||{};f.text=document.getElementById('improveText').value.trim();save({improvement:f});document.getElementById('improveStatus').textContent=tr('Comentario guardado.','Comment saved.')}

function renderWeek(){
 document.getElementById('root').innerHTML=`
 ${header()}${topbar(tTitle('weather'))}
 <div class="card"><span class="small muted">${tr('ESTA SEMANA','THIS WEEK')}</span><h2>🌦️ ${esc(tTitle('weather'))}</h2>
 <div class="menu-list">
  ${homeButton('▶',tr('Empezar / continuar','Start / continue'),tr('Retoma la última tarjeta de este bloque','Resume from your last card in this block'),"startLearning('learn','weather')",true)}
  ${homeButton('🪞',tr('Aprender','Learn'),tr('Tarjetas una a una · audio · ayuda ?','One card at a time · audio · ? help'),"startLearning('learn','weather')")}
  ${homeButton('💬',tr('Frases útiles','Useful phrases'),tr('Frases reales de conversación','Real conversation phrases'),"startLearning('phrases','weather')")}
  ${homeButton('🧠',tr('Practicar','Practice'),tr('El sistema mezcla y repite según fallos','Mixed practice that adapts to mistakes'),"openPractice('topic','weather')")}
  ${homeButton('🪟',tr('Conversación real','Real-life conversation'),tr('Una situación paso a paso','One situation, step by step'),"startLearning('conversation','weather')")}
  ${homeButton('📖',tr('Ver todo','View everything'),tr('Consulta rápida de la lección','Quick reference for the whole lesson'),"go('reference')")}
 </div></div>`;
}

function getSchedule(){
 const s=S();return s.schedule||{};
}
function schedKey(topic,item){return direction+'|'+topic+'|'+item.id}
function gradeItem(topic,item,ok){
 const s=S(),all=s.schedule||{},k=schedKey(topic,item),z=all[k]||{seen:0,correct:0,wrong:0,streak:0,interval:0,due:0};
 z.seen++;z.last=Date.now();
 if(ok){
  z.correct++;z.streak++;
  const seq=[1,3,7,14,30,60];z.interval=seq[Math.min(z.streak-1,seq.length-1)];
  z.due=Date.now()+z.interval*86400000;
 }else{
  z.wrong++;z.streak=0;z.interval=0;z.due=Date.now()+10*60*1000;
 }
 all[k]=z;save({schedule:all});
}
function allPracticeTopics(){
 return Object.entries(C.topics).filter(([id,x])=>x.directions && (x.status==='current'||x.status==='review')).map(([id])=>id);
}
function candidates(topicIds=allPracticeTopics()){
 const schedule=getSchedule(),out=[];
 topicIds.forEach(topic=>{(D(topic).practice_pool||[]).forEach(item=>{
  const z=schedule[schedKey(topic,item)]||{seen:0,wrong:0,correct:0,due:0,streak:0};
  let priority=0;
  if(!z.seen)priority+=5;
  if(z.due && z.due<=Date.now())priority+=7;
  priority+=Math.min(8,z.wrong*2);
  priority-=Math.min(3,z.streak);
  out.push({topic,item,z,priority});
 })});
 return out;
}
function buildSession(mode,topic=null,filter=null){
 let cands=candidates(topic?[topic]:allPracticeTopics());
 if(mode==='tricky')cands=cands.filter(x=>x.z.wrong>0||x.z.due<=Date.now());
 if(filter?.skill)cands=cands.filter(x=>x.item.skill===filter.skill);
 if(mode==='random')cands.sort(()=>Math.random()-.5);
 else cands.sort((a,b)=>b.priority-a.priority||Math.random()-.5);
 if(!cands.length)cands=candidates(topic?[topic]:allPracticeTopics()).sort(()=>Math.random()-.5);
 return cands.slice(0,8).map(x=>({topic:x.topic,item:x.item}));
}
function openPractice(mode='recommended',topic=null,filter=null){
 activity={kind:'practice',mode,topic,items:buildSession(mode,topic,filter),index:0,answered:false,results:[],extra:[]};
 route='activity';renderActivity();
}
function startLearning(kind,topic){
 let items=[];
 const d=D(topic);
 if(kind==='learn')items=(d.learn||[]).map(x=>({type:'learn',topic,data:x}));
 if(kind==='phrases')items=(d.phrases||[]).map(x=>({type:'phrase',topic,data:x}));
 if(kind==='conversation')items=conversationCards(topic);
 const k=direction+'|'+topic+'|'+kind, saved=((S().sectionProgress||{})[k]||0);
 activity={kind,topic,items,index:Math.min(saved,Math.max(0,items.length-1)),answered:false,results:[]};route='activity';renderActivity();
}
function conversationCards(topic){
 const es=direction==='en_es';
 if(topic==='weather'){
  return es?[
   {type:'conversation',topic,icon:'👋',prompt:'You meet your neighbour outside. Start naturally.',answer:'Hola, ¿qué tal?'},
   {type:'conversation',topic,icon:'🪟',prompt:'Look outside. She asks: “¿Qué tiempo hace?” Answer with one true sentence.',answer:'Example: Está nublado, pero hace calor.'},
   {type:'conversation',topic,icon:'💬',prompt:'Keep it going. Ask her one weather question.',answer:'¿Qué tiempo hace hoy?'},
   {type:'conversation',topic,icon:'🌦️',prompt:'Now combine two ideas in one sentence.',answer:'Example: Está nublado, pero hace calor.'}
  ]:[
   {type:'conversation',topic,icon:'👋',prompt:'Te encuentras con tu vecina fuera. Empieza de forma natural.',answer:'Hi, how are you?'},
   {type:'conversation',topic,icon:'🪟',prompt:'Mira fuera. Te pregunta por el tiempo. Responde con una frase verdadera.',answer:'Example: It’s cloudy, but it’s hot.'},
   {type:'conversation',topic,icon:'💬',prompt:'Mantén la conversación. Haz una pregunta sobre el tiempo.',answer:'What’s the weather like today?'},
   {type:'conversation',topic,icon:'🌦️',prompt:'Ahora combina dos ideas en una frase.',answer:'Example: It’s cloudy, but it’s hot.'}
  ];
 }
 return [];
}
function renderActivity(){
 const total=activity.items.length;
 if(activity.index>=total){renderActivityEnd();return}
 const entry=activity.items[activity.index];
 const pct=(activity.index/total)*100;
 document.getElementById('root').innerHTML=`
 ${header()}${topbar(activityTitle())}
 <div class="progress-wrap"><div class="progress"><div style="width:${pct}%"></div></div><div class="counter">${activity.index+1} / ${total}</div></div>
 <div class="card flash" id="flashCard">${renderFlash(entry)}</div>`;
}
function activityTitle(){
 const map={
  practice:tr('Práctica','Practice'),
  learn:tr('Aprender','Learn'),
  phrases:tr('Frases útiles','Useful phrases'),
  conversation:tr('Conversación real','Real-life conversation')
 };
 return map[activity.kind]||tr('Actividad','Activity');
}
function renderFlash(entry){
 if(activity.kind==='practice')return renderPracticeCard(entry);
 const x=entry.data||entry;
 const help=helpForEntry(entry);
 if(entry.type==='learn'||entry.type==='phrase'){
  return `<button class="btn help-btn" onclick='showHelp(${JSON.stringify(help)})'>?</button>
   <div class="flash-icon">${x.icon||'💬'}</div>
   <div class="flash-prompt">${esc(x.target)}</div>
   <div class="flash-sub">${tr('Intenta recordar qué significa antes de mostrarlo.','Try to remember what it means before revealing it.')}</div>
   ${x.audio?`<button class="audio" onclick="play('${esc(x.audio)}')">🔊 ${tr('Escuchar','Listen')}</button>`:''}
   <button class="btn primary center" style="margin-top:12px" onclick="revealLearning()">${tr('MOSTRAR SIGNIFICADO','SHOW MEANING')}</button>
   <div id="learnReveal"></div>`;
 }
 if(entry.type==='conversation'){
  return `<button class="btn help-btn" onclick='showHelp(${JSON.stringify(help)})'>?</button>
   <div class="flash-icon">${entry.icon||'💬'}</div>
   <div class="flash-prompt">${esc(entry.prompt)}</div>
   <div class="flash-sub">${tr('Dilo en voz alta antes de comprobar.','Say it aloud before checking.')}</div>
   <button class="btn primary center" onclick="revealConversation()">${tr('VER UN EJEMPLO','SEE AN EXAMPLE')}</button>
   <div id="learnReveal"></div>`;
 }
}
function revealLearning(){
 const entry=activity.items[activity.index],x=entry.data;
 document.getElementById('learnReveal').innerHTML=`<div class="answer">${esc(x.source)}</div>${x.memory?`<div class="note">🧠 ${esc(x.memory)}</div>`:''}${noteUI(entry.topic,(entry.type==='phrase'?'phrase_':'')+x.id)}${nextBtn()}`;
}
function revealConversation(){
 const entry=activity.items[activity.index];
 document.getElementById('learnReveal').innerHTML=`<div class="answer">${esc(entry.answer)}</div>${nextBtn()}`;
}
function nextBtn(){return `<button class="btn primary center" style="margin-top:12px" onclick="nextCard()">${tr('SIGUIENTE','NEXT')} →</button>`}
function nextCard(){
 activity.index++;
 if(activity.kind!=='practice'){
  const st=S(),pr=st.sectionProgress||{},k=direction+'|'+activity.topic+'|'+activity.kind;
  pr[k]=activity.index>=activity.items.length?0:activity.index;save({sectionProgress:pr});
 }
 activity.answered=false;renderActivity();
}
function helpForEntry(entry){
 const topic=entry.topic||activity.topic||'weather';
 const d=D(topic),x=entry.data||entry;
 if(topic==='weather'){
  if(direction==='en_es'){
   const fam=x.family?`This expression belongs to the ${x.family} weather pattern.`:'The key idea is to choose the Spanish weather pattern instead of translating “it is” word by word.';
   return {title:'WHY?',body:fam+' '+d.why.remember,more:d.why.more};
  } else {
   return {title:'¿POR QUÉ?',body:'No traduzcas «hace» palabra por palabra. '+d.why.remember,more:d.why.more};
  }
 }
 return {title:tr('AYUDA','HELP'),body:d.why?.remember||'',more:d.why?.more||''};
}
function showHelp(obj){
 document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="btn modal-close" onclick="closeModal()">×</button><h2>${esc(obj.title)}</h2><p>${esc(obj.body)}</p>${obj.more?`<details><summary>${tr('Más explicación','More explanation')}</summary><p>${esc(obj.more)}</p></details>`:''}</div></div>`;
}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}

function renderPracticeCard(entry){
 const item=entry.item,help={title:tr('AYUDA','HELP'),body:item.why||tr('Piensa en el patrón que has aprendido.','Think about the pattern you have learned.'),more:''};
 if(item.type==='mc'){
  return `<button class="btn help-btn" onclick='showHelp(${JSON.stringify(help)})'>?</button><div class="flash-icon">${item.icon||'💬'}</div><div class="flash-prompt">${esc(item.prompt)}</div><div class="options">${item.options.map((o,i)=>`<button class="btn center" id="opt${i}" onclick="answerMC(${i})">${esc(o)}</button>`).join('')}</div><div id="practiceFeedback"></div>`;
 }
 if(item.type==='recall'||item.type==='fix'){
  return `<button class="btn help-btn" onclick='showHelp(${JSON.stringify(help)})'>?</button><div class="flash-icon">${item.icon||'💬'}</div><div class="flash-prompt">${esc(item.prompt)}</div><button class="btn primary center" onclick="revealRecall()">${tr('MOSTRAR RESPUESTA','SHOW ANSWER')}</button><div id="practiceFeedback"></div>`;
 }
 if(item.type==='real'){
  return `<button class="btn help-btn" onclick='showHelp(${JSON.stringify(help)})'>?</button><div class="flash-icon">${item.icon||'💬'}</div><div class="flash-prompt">${esc(item.prompt)}</div><button class="btn primary center" onclick="revealReal()">${tr('VER EJEMPLOS','SEE EXAMPLES')}</button><div id="practiceFeedback"></div>`;
 }
}
function answerMC(choice){
 if(activity.answered)return;activity.answered=true;
 const entry=activity.items[activity.index],item=entry.item,ok=choice===item.answer;
 document.getElementById('opt'+item.answer).classList.add('good');if(!ok)document.getElementById('opt'+choice).classList.add('bad');
 gradeItem(entry.topic,item,ok);activity.results.push(ok);
 if(!ok)insertRelatedLater(entry);
 document.getElementById('practiceFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ '+tr('Correcto','Correct'):'✗ '+tr('Casi','Not quite')}</b><br>${esc(item.why||'')}</div>${nextBtn()}`;
}
function revealRecall(){
 if(activity.answered)return;activity.answered=true;
 const entry=activity.items[activity.index],item=entry.item;
 document.getElementById('practiceFeedback').innerHTML=`<div class="answer">${esc(item.answer_text)}</div>${item.audio?`<button class="audio" onclick="play('${esc(item.audio)}')">🔊 ${tr('Escuchar','Listen')}</button>`:''}<div class="chips" style="margin-top:12px"><button class="btn chip good" onclick="selfGrade(true)">${tr('Me salió','I could say it')}</button><button class="btn chip bad" onclick="selfGrade(false)">${tr('No me salió','I couldn’t say it')}</button></div>`;
}
function selfGrade(ok){
 const entry=activity.items[activity.index],item=entry.item;gradeItem(entry.topic,item,ok);activity.results.push(ok);if(!ok)insertRelatedLater(entry);
 document.querySelectorAll('#practiceFeedback .chips').forEach(x=>x.remove());document.getElementById('practiceFeedback').insertAdjacentHTML('beforeend',nextBtn());
}
function revealReal(){
 if(activity.answered)return;activity.answered=true;
 const entry=activity.items[activity.index],item=entry.item;gradeItem(entry.topic,item,true);activity.results.push(true);
 document.getElementById('practiceFeedback').innerHTML=`<div class="feedback good"><b>${tr('Ejemplos posibles','Possible examples')}</b><br>${(item.examples||[]).map(esc).join('<br>')}</div>${nextBtn()}`;
}
function insertRelatedLater(entry){
 const pool=D(entry.topic).practice_pool||[];
 const alt=pool.find(x=>x.skill===entry.item.skill&&x.id!==entry.item.id);
 if(alt){
  const pos=Math.min(activity.items.length,activity.index+3);
  if(!activity.items.slice(activity.index+1).some(x=>x.item?.id===alt.id))activity.items.splice(pos,0,{topic:entry.topic,item:alt});
 }
}
function renderActivityEnd(){
 const wrong=(activity.results||[]).filter(x=>!x).length;
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Terminado','Finished'))}<div class="card"><h2>${tr('Sesión terminada','Practice complete')}</h2><p>${wrong?tr('Lo que ha costado queda programado para volver a aparecer.','Anything that was difficult is scheduled to return.') : tr('Buen repaso. Estas ideas volverán más adelante para comprobar que siguen disponibles.','Good review. These ideas will return later so you can retrieve them again.')}</p><button class="btn primary center" onclick="openPractice('recommended')">${tr('PRACTICAR OTRA VEZ','PRACTISE AGAIN')}</button><button class="btn center" style="margin-top:8px" onclick="go('home')">${tr('VOLVER AL INICIO','BACK HOME')}</button></div>`;
}

 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Mis difíciles','My tricky ones'))}<div class="card"><h2>🧠 ${tr('Mis difíciles','My tricky ones')}</h2><p>${tr('Language Mirror decide qué conviene recuperar antes según tus fallos y el tiempo desde la última práctica.','Language Mirror prioritises what is worth retrieving based on mistakes and time since the last review.')}</p><div class="menu-list">

function patternLabel(s){
 const labels={hace_vs_esta:'HACE / ESTÁ',lluvia_llover:'lluvia / llover / lloviendo',combine_patterns:tr('Combinar patrones','Combining patterns'),weather_pattern:"It's + adjective",rain_action:'rain / raining',real_life:tr('Conversación real','Real-life conversation')};
 return labels[s]||s.replaceAll('_',' ');
}

function renderGames(){
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Jugar y repasar','Play & review'))}<div class="card"><h2>🎲 ${tr('Jugar y repasar','Play & review')}</h2><p>${tr('Juegos tranquilos con contenido que ya has visto. No añaden un temario nuevo.','Calm activities using language you have already seen. They do not add a second curriculum.')}</p><div class="menu-list">
 ${homeButton('🔧',tr('Corrige el error','Fix it'),tr('Detecta y corrige frases','Spot and correct sentences'),"startGame('fix')")}
 ${homeButton('🖼️',tr('Reto de imagen','Picture challenge'),tr('Mira · dilo · comprueba','Look · say it · check'),"startGame('picture')")}
 ${homeButton('🔀',tr('Mezcla libre','Random mix'),tr('Una mezcla tranquila de lo aprendido','A calm mix of what you have learned'),"openPractice('random')")}
 </div></div>`;
}
function startGame(kind){
 let pool=candidates().map(x=>({topic:x.topic,item:x.item}));
 if(kind==='fix')pool=pool.filter(x=>x.item.type==='fix');
 if(kind==='picture')pool=pool.filter(x=>x.item.type==='recall');
 if(!pool.length)pool=candidates().map(x=>({topic:x.topic,item:x.item}));
 pool.sort(()=>Math.random()-.5);activity={kind:'practice',mode:'game',items:pool.slice(0,8),index:0,answered:false,results:[]};route='activity';renderActivity();
}

 const available=Object.entries(C.topics).filter(([id,x])=>x.directions);
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Explorar temas','Explore topics'))}<div class="card"><h2>🗂️ ${tr('Explorar','Explore')}</h2><p>${tr('Puedes abrir cualquier tema disponible y practicarlo por curiosidad. Eso no cambia automáticamente la lección semanal.','You can open any available topic and practise it out of curiosity. This does not automatically change the weekly lesson.')}</p><div class="menu-list">${available.map(([id,x])=>homeButton(x.icon,tTitle(id),x.status==='current'?tr('Tema de esta semana','This week'):tr('Disponible para explorar','Available to explore'),`openExploreTopic('${id}')`)).join('')}</div></div>`;
}

 ${homeButton('🪞',tr('Aprender','Learn'),tr('Tarjetas una a una','One card at a time'),`startLearning('learn','${id}')`,true)}
 ${(D(id).phrases||[]).length?homeButton('💬',tr('Frases útiles','Useful phrases'),tr('Frases reales de este tema','Real phrases from this topic'),`startLearning('phrases','${id}')`):''}
 ${homeButton('🧠',tr('Practicar','Practice'),tr('Practicar este tema libremente','Freely practise this topic'),`openPractice('random','${id}')`)}
 </div></div>`;
}

function noteUI(topic,id){
 const k=direction+'|'+topic+'|'+id,n=(S().notes||{})[k]||'';
 return `<details style="margin-top:12px"><summary>✏️ ${tr('Mi nota','My note')}</summary><textarea id="note_${safe(k)}" placeholder="${esc(tr('Esto me recuerda a…','This reminds me of…'))}">${esc(n)}</textarea><button class="btn soft center" onclick="saveNote('${esc(k)}')">${tr('GUARDAR','SAVE')}</button></details>`;
}

}

/* Hidden face-to-face mode */
let classSide='en_es',classIndex=0;
function classCards(){
 const she=[
  {icon:'👋',title:'Warm-up',main:'Talk normally for one minute.',sub:'Use Spanish as much as possible. If communication breaks, use English briefly and return to Spanish.'},
  {icon:'🪟',title:'Real life',main:'Look outside together.',sub:'Ask: “¿Qué tiempo hace?” Let the answer grow into a real neighbour conversation.'},
  {icon:'🔧',title:'Fix my Spanish',main:'Say deliberately: “Está sol.”',sub:'Can she correct you? Ask her to repeat the correct sentence naturally.'},
  {icon:'🪞',title:'Mirror',main:'You say: “It’s windy.”',sub:'She says the Spanish. Then she gives you a Spanish phrase and you give the English.'},
  {icon:'❓',title:'Explain if needed',main:'If either of you knows something is right but cannot explain why, use the explanation helper.',sub:'The explanation should be in the learner’s strong language.'},
  {icon:'🔁',title:'Try again',main:'Return to the window conversation.',sub:'Use the corrected language in a fresh sentence. End with one note about what appeared naturally.'}
 ];
 const me=[
  {icon:'👋',title:'Calentamiento',main:'Hablad con normalidad durante un minuto.',sub:'Usa inglés todo lo posible. Utiliza español brevemente solo cuando una aclaración realmente ayude.'},
  {icon:'🪟',title:'Vida real',main:'Mirad por la ventana juntas.',sub:'Ella te pregunta por el tiempo. Responde de forma natural en inglés y deja que la conversación continúe.'},
  {icon:'🔧',title:'Fix my English',main:'Ella dice deliberadamente: “It makes sun.”',sub:'Corrígelo: “It’s sunny.” Después usa tú mismo el patrón correcto.'},
  {icon:'🪞',title:'Mirror',main:'Ella dice: “Hace viento.”',sub:'Tú dices la frase en inglés. Después intercambiad las direcciones.'},
  {icon:'❓',title:'Explicar si hace falta',main:'Usad la ayuda de explicación si cuesta comunicar el PORQUÉ.',sub:'La explicación para ti debe aparecer en español.'},
  {icon:'🔁',title:'Intentarlo otra vez',main:'Repetid la conversación real.',sub:'Usa el inglés corregido de manera natural, no como un ejercicio de gramática.'}
 ];
 return classSide==='en_es'?she:me;
}
function renderClass(){
 const cards=classCards(),x=cards[classIndex], classEs=(classSide==='es_en');
 const ct=(es,en)=>classEs?es:en;
 document.getElementById('root').innerHTML=`${header()}${topbar(ct('Modo juntas','Together mode'))}<div class="chips" style="margin-bottom:9px"><button class="btn chip ${classSide==='en_es'?'soft':''}" onclick="classSide='en_es';classIndex=0;renderClass()">🇬🇧 → 🇪🇸</button><button class="btn chip ${classSide==='es_en'?'soft':''}" onclick="classSide='es_en';classIndex=0;renderClass()">🇪🇸 → 🇬🇧</button></div><div class="progress-wrap"><div class="progress"><div style="width:${((classIndex+1)/cards.length)*100}%"></div></div><div class="counter">${classIndex+1} / ${cards.length}</div></div><div class="card class-card"><div class="flash-icon">${x.icon}</div><div class="class-instruction">${esc(x.title)}</div><div class="class-main">${esc(x.main)}</div><p>${esc(x.sub)}</p>${(x.title.startsWith('Explain')||x.title.startsWith('Explicar'))?`<button class="btn soft center" onclick="copyExplain()">${ct('COPIAR PROMPT DE EXPLICACIÓN','COPY EXPLANATION PROMPT')}</button>`:''}<div class="chips" style="margin-top:15px">${classIndex?`<button class="btn chip" onclick="classIndex--;renderClass()">←</button>`:''}${classIndex<cards.length-1?`<button class="btn chip primary" onclick="classIndex++;renderClass()">${ct('SIGUIENTE','NEXT')} →</button>`:`<button class="btn chip primary" onclick="go('home')">${ct('TERMINAR','FINISH')}</button>`}</div></div>`;
}
function copyExplain(){
 const p=classSide==='en_es'?'Explain the Spanish point we are discussing to a native English-speaking adult learner. Use simple English, compare Spanish and English directly, avoid unnecessary grammar terminology, and give two everyday examples.':'Explica el punto de inglés que estamos tratando a una persona adulta hispanohablante. Usa español sencillo, compara directamente inglés y español, evita terminología gramatical innecesaria y da dos ejemplos cotidianos.';
 copyText(p);
}
function play(src){new Audio(src).play().catch(()=>alert(tr('No se pudo reproducir el audio.','The audio could not play.')))}
function copyText(x){navigator.clipboard.writeText(x).then(()=>alert(tr('Copiado.','Copied.'))).catch(()=>prompt(tr('Copia este texto:','Copy this text:'),x))}
</script>
