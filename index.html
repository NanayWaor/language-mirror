<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Language Mirror</title>
<style>
:root{
 --bg:#f4f1e8;--card:#fffdf8;--text:#252823;--muted:#6b716c;--line:#d8d3c6;
 --accent:#3b6b5d;--soft:#e9f1ed;--blue:#edf3fb;--blue2:#d7e3f4;
 --good:#e8f3e8;--goodline:#71957a;--bad:#faece9;--badline:#bd7668;
 --note:#fff7dc;--shadow:0 3px 13px rgba(0,0,0,.055)
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:19px;line-height:1.45}
button,textarea,select{font:inherit}
main{max-width:680px;margin:auto;padding:17px 13px 76px}
h1{font-size:34px;line-height:1.05;margin:5px 0 4px}
h2{font-size:27px;line-height:1.15;margin:0 0 11px}
h3{font-size:22px;line-height:1.2;margin:0 0 8px}
.small{font-size:16px}.muted{color:var(--muted)}
.eyebrow{font-size:14px;font-weight:850;letter-spacing:.06em;color:var(--muted)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:19px;padding:17px;margin:13px 0;box-shadow:var(--shadow)}
.btn{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px 14px;font-weight:780;text-align:left;cursor:pointer;white-space:normal}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.soft{background:var(--soft);border-color:#bfd3cb}
.btn.good{background:var(--good);border-color:var(--goodline)}
.btn.bad{background:var(--bad);border-color:var(--badline)}
.btn.center{text-align:center}
.btn.compact{width:auto;min-height:42px;padding:8px 11px}
.hidden{display:none!important}
.header{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.header-title{flex:1;user-select:none;-webkit-user-select:none}
.direction{width:auto;min-height:42px;padding:8px 10px;font-size:14px}
.section-label{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.07em;margin:25px 4px 7px}
.home-grid{display:grid;gap:9px}
.home-btn{display:grid;grid-template-columns:42px minmax(0,1fr) 22px;gap:10px;align-items:center}
.home-icon{font-size:30px;text-align:center}.arrow{font-size:24px;color:var(--muted)}
.info-card{background:transparent;border:1.5px dashed var(--line);border-radius:16px;padding:13px 15px;color:var(--muted)}
details summary{cursor:pointer;font-weight:780}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:13px}.back{width:auto;min-height:42px;padding:7px 11px}.spacer{flex:1}
.progress-wrap{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;margin:7px 0 14px}
.progress{height:7px;border-radius:999px;background:#dcd7cb;overflow:hidden}.progress>div{height:100%;background:var(--accent)}
.counter{font-size:15px;color:var(--muted);font-weight:800}
.flash{min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
.help-btn{position:absolute;top:13px;right:13px;width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;text-align:center;font-size:21px;background:var(--blue);border-color:var(--blue2)}
.flash-icon{font-size:70px;line-height:1;text-align:center;margin:8px 0 14px}
.flash-prompt{font-size:25px;line-height:1.26;font-weight:870;text-align:center;margin:7px 0 16px;overflow-wrap:anywhere}
.flash-sub{font-size:17px;color:var(--muted);text-align:center;margin:-5px 0 14px}
.answer{margin-top:12px;background:var(--soft);border-radius:15px;padding:14px;text-align:center;font-size:25px;font-weight:880;overflow-wrap:anywhere}
.options{display:grid;gap:8px}
.feedback{margin-top:12px;border-radius:14px;padding:13px;text-align:left;font-size:18px}
.feedback.good{background:var(--good);border:1.5px solid var(--goodline)}
.feedback.bad{background:var(--bad);border:1.5px solid var(--badline)}
.audio{width:auto;min-height:45px;border:0;border-radius:12px;background:var(--accent);color:#fff;padding:8px 13px;font-weight:800;cursor:pointer;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(31,34,31,.42);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:20}
.modal{width:min(650px,100%);max-height:82vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 12px 50px rgba(0,0,0,.22)}
.modal h2{padding-right:45px}.modal-close{float:right;width:44px;min-height:44px;text-align:center;padding:0}
.family{background:white;border:1.5px solid var(--blue2);border-radius:13px;padding:10px;margin:7px 0}
.note{background:var(--note);border-radius:13px;padding:11px;margin:9px 0;font-size:17px}
.menu-list{display:grid;gap:9px}
.topic-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.topic-icon{font-size:32px;text-align:center}
.topic-title{font-weight:850}
.ref-item{border-top:1.5px solid var(--line);padding:13px 0}.ref-item:first-child{border-top:0}
.ref-target{font-size:23px;font-weight:850}.ref-source{font-size:16px;color:var(--muted)}
textarea{width:100%;min-height:100px;border:1.5px solid var(--line);border-radius:13px;padding:11px;background:white;color:var(--text);resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{width:auto;min-height:42px;padding:8px 11px}
.scoreline{font-size:16px;color:var(--muted);margin-top:8px}
.class-card{min-height:430px;display:flex;flex-direction:column;justify-content:center}
.class-main{font-size:27px;font-weight:880;line-height:1.24;margin:10px 0}.class-instruction{font-size:16px;color:var(--muted)}
@media(min-width:760px){main{max-width:780px}.home-grid.two{grid-template-columns:1fr 1fr}.flash{min-height:450px}}
.puzzle-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;max-width:390px;margin:15px auto}.letter{aspect-ratio:1;border:1.5px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;background:#fff;font-weight:850;font-size:20px;cursor:pointer}.letter.selected{background:var(--soft);border-color:var(--accent)}.word-list{text-align:center;word-spacing:10px;line-height:1.8;font-weight:800}
</style>
</head>
<body>
<main><div id="root"></div></main>
<div id="modalRoot"></div>
<script>
let C=null;
const KEY='language_mirror_v5';
let direction=localStorage.getItem('lm_v5_direction')||'en_es';
let route='home';
let activity=null;
let titleTaps=[];

function S(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(p){localStorage.setItem(KEY,JSON.stringify(Object.assign(S(),p,{updatedAt:new Date().toISOString()})))}
function tr(es,en){return direction==='es_en'?es:en}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function safe(s){return String(s).replace(/[^a-zA-Z0-9]/g,'_')}
function tTitle(id){const x=C.topics[id].title;return x[direction==='en_es'?'en':'es']}
function D(topic='weather'){return C.topics[topic].directions[direction]}
function go(r){route=r;activity=null;closeModal();scrollTo(0,0);render()}
function header(){
 return `<div class="header">
   <div class="header-title" onclick="secretTap()"><div class="eyebrow">LANGUAGE MIRROR · PROTOTYPE 005</div><h1>Language Mirror</h1></div>
   <button class="btn direction" onclick="languageSettings()">${direction==='en_es'?'Learning Spanish':'Aprendo inglés'}</button>
 </div>`;
}

function topbar(title){
 return `<div class="topbar"><button class="btn back" onclick="go('home')">←</button><b>${esc(title)}</b><span class="spacer"></span></div>`;
}
function secretTap(){
 const now=Date.now();titleTaps=titleTaps.filter(x=>now-x<1400);titleTaps.push(now);
 if(titleTaps.length>=3){titleTaps=[];startClass();}
}
function switchDirection(){ languageSettings(); }
function languageSettings(){
 document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="btn modal-close" onclick="closeModal()">×</button><h2>Language</h2><div class="menu-list"><button class="btn ${direction==='en_es'?'soft':''}" onclick="setDirection('en_es')">🇬🇧 I speak English · I’m learning Spanish</button><button class="btn ${direction==='es_en'?'soft':''}" onclick="setDirection('es_en')">🇪🇸 Hablo español · aprendo inglés</button></div></div></div>`;
}
function setDirection(d){ direction=d;localStorage.setItem('lm_v5_direction',d);activity=null;closeModal();render(); }

fetch('course.json?ts='+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).then(x=>{
 C=x;
 const q=new URLSearchParams(location.search);
 if(q.get('class')==='1')startClass(); else render();
}).catch(e=>document.getElementById('root').innerHTML='<div class="card">Could not load course.json.</div>');

function render(){
 if(!C)return;
 document.documentElement.lang=direction==='en_es'?'en':'es';
 const routes={home:renderHome,today:()=>openPractice('recommended'),week:renderWeek,tricky:renderTricky,games:renderGames,explore:renderExplore,notes:renderNotes,ai:renderAI,class:renderClass,reference:renderReference,puzzle:renderPuzzle};
 (routes[route]||renderHome)();
}
function homeButton(icon,title,sub,onclick,primary=false){
 return `<button class="btn home-btn ${primary?'primary':''}" onclick="${onclick}"><span class="home-icon">${icon}</span><span><b>${esc(title)}</b><br><span class="small">${esc(sub)}</span></span><span class="arrow">›</span></button>`;
}
function renderHome(){
 document.getElementById('root').innerHTML=`
 ${header()}
 <div class="section-label">${tr('HOY','TODAY')}</div>
 <div class="home-grid">${homeButton('▶',tr('Práctica de hoy','Today’s practice'),tr('Language Mirror elige qué conviene practicar','Language Mirror chooses what is useful to practise'),"openPractice('recommended')",true)}</div>
 <div class="section-label">${tr('ESTA SEMANA','THIS WEEK')}</div>
 <div class="home-grid">${homeButton('🌦️',tr('Una conversación corta con tu vecina','A short chat with your neighbour'),tr('El tiempo y conversación cotidiana','Weather & everyday small talk'),"go('week')")}</div>
 <div class="section-label">${tr('EXPLORAR','EXPLORE')}</div>
 <div class="home-grid">${homeButton('🗂️',tr('Explorar temas','Explore topics'),tr('Abre y practica libremente otros temas disponibles','Open and freely practise available topics'),"go('explore')")}</div>
 <details class="card" style="margin-top:28px"><summary>${tr('Ayudar a mejorar Language Mirror (opcional)','Help improve Language Mirror (optional)')}</summary><p class="small muted">${tr('No forma parte del estudio. Puedes ignorarlo completamente.','This is not part of your study. You can completely ignore it.')}</p><div class="chips"><button class="btn chip" onclick="feedbackTag('clear')">👍 ${tr('Claro','Clear')}</button><button class="btn chip" onclick="feedbackTag('confusing')">❓ ${tr('Algo confunde','Something is confusing')}</button><button class="btn chip" onclick="feedbackTag('missing')">💡 ${tr('Me falta algo','Something is missing')}</button></div><textarea id="improveText" placeholder="${esc(tr('Comentario opcional…','Optional comment…'))}"></textarea><button class="btn soft center" onclick="saveImprovement()">${tr('GUARDAR','SAVE')}</button><div id="improveStatus" class="small muted"></div></details>`;
}

function feedbackTag(tag){const s=S(),f=s.improvement||{};f.tag=tag;save({improvement:f});document.getElementById('improveStatus').textContent=tr('Guardado.','Saved.')}
function saveImprovement(){const s=S(),f=s.improvement||{};f.text=document.getElementById('improveText').value.trim();save({improvement:f});document.getElementById('improveStatus').textContent=tr('Comentario guardado.','Comment saved.')}

function renderWeek(){
 document.getElementById('root').innerHTML=`
 ${header()}${topbar(tr('Esta semana','This week'))}
 <div class="card"><span class="small muted">${tr('ESTA SEMANA','THIS WEEK')}</span><h2>🌦️ ${tr('Una conversación corta con tu vecina','A short chat with your neighbour')}</h2><p class="muted">${tr('El tiempo y conversación cotidiana','Weather & everyday small talk')}</p><button class="btn primary center" onclick="startLearning('learn','weather')">${tr('EMPEZAR / CONTINUAR','START / CONTINUE')}</button></div>
 <div class="card"><div class="section-label" style="margin-top:0">${tr('ACTIVIDADES PRINCIPALES','CORE ACTIVITIES')}</div><div class="menu-list">
  ${homeButton('🪞',tr('Aprender','Learn'),tr('Tarjetas · audio · ayuda ?','Cards · audio · ? help'),"startLearning('learn','weather')")}
  ${homeButton('💬',tr('Frases útiles','Useful phrases'),tr('Frases reales de conversación','Real conversation phrases'),"startLearning('phrases','weather')")}
  ${homeButton('🧠',tr('Practicar','Practice'),tr('Recomendado · difíciles · aleatorio · patrones','Recommended · tricky · random · patterns'),"practiceMenu('weather')")}
  ${homeButton('🪟',tr('Conversación real','Real-life conversation'),tr('Una situación que avanza paso a paso','A situation that moves step by step'),"startLearning('conversation','weather')")}
 </div><div class="section-label">${tr('SI TE APETECE SEGUIR','IF YOU WANT MORE')}</div><div class="menu-list">
  ${homeButton('🗣️',tr('Hablar con IA','Talk with AI'),tr('Conversación sobre esta misión','Conversation about this mission'),"go('ai')")}
  ${homeButton('📝',tr('Mis notas','My notes'),tr('Notas y asociaciones de este tema','Notes and memory links for this topic'),"go('notes')")}
  ${homeButton('🧩',tr('Pausa de puzle','Puzzle break'),tr('Una actividad distinta, sin contar como progreso','Something different; it does not count as progress'),"go('puzzle')")}
  ${homeButton('📖',tr('Ver todo','View everything'),tr('Consulta rápida de la lección','Quick reference for the whole lesson'),"go('reference')")}
 </div></div>`;
}

function getSchedule(){
 const s=S();return s.schedule||{};
}
function schedKey(topic,item){return direction+'|'+topic+'|'+item.id}
function gradeItem(topic,item,ok){
 const s=S(),all=s.schedule||{},k=schedKey(topic,item),z=all[k]||{seen:0,correct:0,wrong:0,streak:0,interval:0,due:0};
 z.seen++;z.last=Date.now();
 if(ok){
  z.correct++;z.streak++;
  const seq=[1,3,7,14,30,60];z.interval=seq[Math.min(z.streak-1,seq.length-1)];
  z.due=Date.now()+z.interval*86400000;
 }else{
  z.wrong++;z.streak=0;z.interval=0;z.due=Date.now()+10*60*1000;
 }
 all[k]=z;save({schedule:all});
}
function allPracticeTopics(){
 const ids=new Set([C.current_topic]),st=getSchedule();
 Object.keys(st).forEach(k=>{const p=k.split('|');if(p[0]===direction&&C.topics[p[1]]?.directions)ids.add(p[1]);});
 return [...ids];
}

function candidates(topicIds=allPracticeTopics()){
 const schedule=getSchedule(),out=[];
 topicIds.forEach(topic=>{(D(topic).practice_pool||[]).forEach(item=>{
  const z=schedule[schedKey(topic,item)]||{seen:0,wrong:0,correct:0,due:0,streak:0};
  let priority=0;
  if(!z.seen)priority+=5;
  if(z.due && z.due<=Date.now())priority+=7;
  priority+=Math.min(8,z.wrong*2);
  priority-=Math.min(3,z.streak);
  out.push({topic,item,z,priority});
 })});
 return out;
}
function buildSession(mode,topic=null,filter=null){
 let cands=candidates(topic?[topic]:allPracticeTopics());
 if(mode==='tricky')cands=cands.filter(x=>x.z.wrong>0);
 if(filter?.skill)cands=cands.filter(x=>x.item.skill===filter.skill);
 if(mode==='random')cands.sort(()=>Math.random()-.5); else cands.sort((a,b)=>b.priority-a.priority||Math.random()-.5);
 if(!cands.length)cands=candidates(topic?[topic]:allPracticeTopics()).sort(()=>Math.random()-.5);
 let items=cands.slice(0,8).map(x=>({topic:x.topic,item:x.item}));
 const extTopic=topic||C.current_topic,base=candidates([extTopic]),correct=base.reduce((a,x)=>a+x.z.correct,0),wrong=base.reduce((a,x)=>a+x.z.wrong,0),seen=base.filter(x=>x.z.seen).length;
 if(seen>=4&&correct>=8&&correct>=wrong*2&&D(extTopic).extension_pool?.length){const e=D(extTopic).extension_pool[Math.floor(Math.random()*D(extTopic).extension_pool.length)];items.splice(Math.min(5,items.length),0,{topic:extTopic,item:e,extension:true});}
 return items.slice(0,8);
}

function openPractice(mode='recommended',topic=null,filter=null){
 activity={kind:'practice',mode,topic,items:buildSession(mode,topic,filter),index:0,answered:false,results:[],extra:[]};
 route='activity';renderActivity();
}
function startLearning(kind,topic){
 let items=[];
 const d=D(topic);
 if(kind==='learn')items=(d.learn||[]).map(x=>({type:'learn',topic,data:x}));
 if(kind==='phrases')items=(d.phrases||[]).map(x=>({type:'phrase',topic,data:x}));
 if(kind==='conversation')items=conversationCards(topic);
 const k=direction+'|'+topic+'|'+kind, saved=((S().sectionProgress||{})[k]||0);
 activity={kind,topic,items,index:Math.min(saved,Math.max(0,items.length-1)),answered:false,results:[]};route='activity';renderActivity();
}
function conversationCards(topic){
 if(topic!=='weather')return [];
 return direction==='en_es'?[
  {type:'conversation',topic,icon:'👋',prompt:'You meet your neighbour outside. Start naturally in Spanish.',answer:'Hola, ¿qué tal?'},
  {type:'conversation',topic,icon:'🪟',prompt:'Look outside. Your neighbour asks: “¿Qué tiempo hace?” Answer with one true sentence.',answer:'Example: Está nublado, pero hace calor.'},
  {type:'conversation',topic,icon:'↪️',prompt:'She answers. Keep the conversation going with one short reaction or question.',answer:'Examples: Sí, hace mucho viento. / ¿Crees que va a llover?'},
  {type:'conversation',topic,icon:'🌦️',prompt:'Say two things about today in one sentence.',answer:'Example: Está nublado, pero hace calor.'},
  {type:'conversation',topic,icon:'👋',prompt:'Finish the short neighbour chat naturally.',answer:'Example: Bueno, nos vemos luego.'}
 ]:[
  {type:'conversation',topic,icon:'👋',prompt:'Te encuentras con tu vecina. Empieza de forma natural en inglés.',answer:'Hi, how are you?'},
  {type:'conversation',topic,icon:'🪟',prompt:'Mira fuera. Tu vecina te pregunta por el tiempo. Responde con una frase verdadera.',answer:'Example: It’s cloudy, but it’s hot.'},
  {type:'conversation',topic,icon:'↪️',prompt:'Ella responde. Mantén la conversación con una reacción o pregunta corta.',answer:'Examples: Yes, it’s very windy. / Do you think it’s going to rain?'},
  {type:'conversation',topic,icon:'🌦️',prompt:'Di dos cosas sobre hoy en una sola frase.',answer:'Example: It’s cloudy, but it’s hot.'},
  {type:'conversation',topic,icon:'👋',prompt:'Termina la conversación de vecinas de forma natural.',answer:'Example: Anyway, see you later.'}
 ];
}

function renderActivity(){
 const total=activity.items.length;
 if(activity.index>=total){renderActivityEnd();return}
 const entry=activity.items[activity.index];
 const pct=(activity.index/total)*100;
 document.getElementById('root').innerHTML=`
 ${header()}${topbar(activityTitle())}
 <div class="progress-wrap"><div class="progress"><div style="width:${pct}%"></div></div><div class="counter">${activity.index+1} / ${total}</div></div>
 <div class="card flash" id="flashCard">${renderFlash(entry)}</div>`;
}
function activityTitle(){
 const map={
  practice:tr('Práctica','Practice'),
  learn:tr('Aprender','Learn'),
  phrases:tr('Frases útiles','Useful phrases'),
  conversation:tr('Conversación real','Real-life conversation')
 };
 return map[activity.kind]||tr('Actividad','Activity');
}
function renderFlash(entry){
 if(activity.kind==='practice')return renderPracticeCard(entry);
 const x=entry.data||entry;
 const help=helpForEntry(entry);
 if(entry.type==='learn'||entry.type==='phrase'){
  return `<button class="btn help-btn" onclick='showHelp(${JSON.stringify(help)})'>?</button>
   <div class="flash-icon">${x.icon||'💬'}</div>
   <div class="flash-prompt">${esc(x.target)}</div>
   <div class="flash-sub">${tr('Intenta recordar qué significa antes de mostrarlo.','Try to remember what it means before revealing it.')}</div>
   ${x.audio?`<button class="audio" onclick="play('${esc(x.audio)}')">🔊 ${tr('Escuchar','Listen')}</button>`:''}
   <button class="btn primary center" style="margin-top:12px" onclick="revealLearning()">${tr('MOSTRAR SIGNIFICADO','SHOW MEANING')}</button>
   <div id="learnReveal"></div>`;
 }
 if(entry.type==='conversation'){
  return `<button class="btn help-btn" onclick='showHelp(${JSON.stringify(help)})'>?</button>
   <div class="flash-icon">${entry.icon||'💬'}</div>
   <div class="flash-prompt">${esc(entry.prompt)}</div>
   <div class="flash-sub">${tr('Dilo en voz alta antes de comprobar.','Say it aloud before checking.')}</div>
   <button class="btn primary center" onclick="revealConversation()">${tr('VER UN EJEMPLO','SEE AN EXAMPLE')}</button>
   <div id="learnReveal"></div>`;
 }
}
function revealLearning(){
 const entry=activity.items[activity.index],x=entry.data;
 document.getElementById('learnReveal').innerHTML=`<div class="answer">${esc(x.source)}</div>${x.memory?`<div class="note">🧠 ${esc(x.memory)}</div>`:''}${noteUI(entry.topic,(entry.type==='phrase'?'phrase_':'')+x.id)}${nextBtn()}`;
}
function revealConversation(){
 const entry=activity.items[activity.index];
 document.getElementById('learnReveal').innerHTML=`<div class="answer">${esc(entry.answer)}</div>${nextBtn()}`;
}
function nextBtn(){return `<button class="btn primary center" style="margin-top:12px" onclick="nextCard()">${tr('SIGUIENTE','NEXT')} →</button>`}
function nextCard(){
 activity.index++;
 if(activity.kind!=='practice'){
  const st=S(),pr=st.sectionProgress||{},k=direction+'|'+activity.topic+'|'+activity.kind;
  pr[k]=activity.index>=activity.items.length?0:activity.index;save({sectionProgress:pr});
 }
 activity.answered=false;renderActivity();
}
function helpForEntry(entry){
 const topic=entry.topic||activity.topic||'weather',d=D(topic),x=entry.data||entry;
 if(entry.type==='learn'&&d.item_why?.[x.id])return d.item_why[x.id];
 if(entry.type==='phrase'&&d.phrase_why?.[x.id])return d.phrase_why[x.id];
 if(entry.type==='conversation')return {title:tr('AYUDA','HELP'),body:tr('Piensa en qué quieres conseguir en la conversación. No hace falta una frase perfecta para continuar.','Think about what you want to do in the conversation. You do not need a perfect sentence to keep it moving.')};
 return {title:tr('AYUDA','HELP'),body:d.why?.remember||''};
}

function showHelp(obj){

function practiceHelp(entry){

function answerMC(choice){
 if(activity.answered)return;activity.answered=true;
 const entry=activity.items[activity.index],item=entry.item,ok=choice===item.answer;
 document.getElementById('opt'+item.answer).classList.add('good');if(!ok)document.getElementById('opt'+choice).classList.add('bad');
 gradeItem(entry.topic,item,ok);activity.results.push(ok);
 if(!ok)insertRelatedLater(entry);
 document.getElementById('practiceFeedback').innerHTML=`<div class="feedback ${ok?'good':'bad'}"><b>${ok?'✓ '+tr('Correcto','Correct'):'✗ '+tr('Casi','Not quite')}</b><br>${esc(item.why||'')}</div>${nextBtn()}`;
}
function revealRecall(){

function selfGrade(ok){
 const entry=activity.items[activity.index],item=entry.item;gradeItem(entry.topic,item,ok);activity.results.push(ok);if(!ok)insertRelatedLater(entry);
 document.querySelectorAll('#practiceFeedback .chips').forEach(x=>x.remove());document.getElementById('practiceFeedback').insertAdjacentHTML('beforeend',nextBtn());

function revealReal(){
 if(activity.answered)return;activity.answered=true;
 const entry=activity.items[activity.index],item=entry.item;gradeItem(entry.topic,item,true);activity.results.push(true);
 document.getElementById('practiceFeedback').innerHTML=`<div class="feedback good"><b>${tr('Ejemplos posibles','Possible examples')}</b><br>${(item.examples||[]).map(esc).join('<br>')}</div>${nextBtn()}`;

function insertRelatedLater(entry){
 const pool=D(entry.topic).practice_pool||[];
 const alt=pool.find(x=>x.skill===entry.item.skill&&x.id!==entry.item.id);
 if(alt){
  const pos=Math.min(activity.items.length,activity.index+3);
  if(!activity.items.slice(activity.index+1).some(x=>x.item?.id===alt.id))activity.items.splice(pos,0,{topic:entry.topic,item:alt});

let puzzleGrid=null,puzzleSelection=[];
function buildPuzzleGrid(words){
 const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ',g=Array(36).fill('');
 words.slice(0,4).forEach((raw,idx)=>{const w=raw.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase();if(idx%2===0){const row=idx+1,start=Math.max(0,6-w.length);for(let i=0;i<w.length&&start+i<6;i++)g[row*6+start+i]=w[i];}else{const col=idx+1,start=Math.max(0,6-w.length);for(let i=0;i<w.length&&start+i<6;i++)g[(start+i)*6+col]=w[i];}});
 return g.map(x=>x||letters[Math.floor(Math.random()*letters.length)]);
}
function renderPuzzle(){
 const words=D('weather').puzzle_words||[],g=puzzleGrid||buildPuzzleGrid(words);puzzleGrid=g;
 document.getElementById('root').innerHTML=`${header()}${topbar(tr('Pausa de puzle','Puzzle break'))}<div class="card"><h2>🔎 ${tr('Encuentra palabras','Find the words')}</h2><p>${tr('Es una pausa opcional: no es examen y no cambia tu progreso.','This is an optional puzzle break: it is not a test and does not change your progress.')}</p><div class="word-list">${words.slice(0,4).map(esc).join(' · ')}</div><div class="puzzle-grid">${g.map((l,i)=>`<button class="letter ${puzzleSelection.includes(i)?'selected':''}" onclick="togglePuzzleLetter(${i})">${l}</button>`).join('')}</div><button class="btn soft center" onclick="newPuzzle()">${tr('OTRO PUZLE','ANOTHER PUZZLE')}</button></div>`;
}
function togglePuzzleLetter(i){if(puzzleSelection.includes(i))puzzleSelection=puzzleSelection.filter(x=>x!==i);else puzzleSelection.push(i);renderPuzzle();}
function newPuzzle(){puzzleGrid=null;puzzleSelection=[];renderPuzzle();}

let classSession=null;
function buildClassCards(){
 return [
 {person:'Susan',dir:'en_es',icon:'💨',prompt:'Eli says: “It’s windy.” Say the natural Spanish.',help:'Target: Hace viento.'},
 {person:'Susan',dir:'en_es',icon:'🔧',prompt:'Eli deliberately says: “Está sol.” Correct the Spanish.',help:'Target: Hace sol.'},
 {person:'Susan',dir:'en_es',icon:'🪟',prompt:'Ask Eli in Spanish what the weather is like. Then react to the answer.',help:'Useful start: ¿Qué tiempo hace?'},

 {person:'Susan',dir:'en_es',icon:'↪️',prompt:'Tell Eli one true thing about the weather, then ask a short follow-up question.',help:'Keep the conversation moving; perfection is not the goal.'},
 {person:'Eli',dir:'es_en',icon:'🥶',prompt:'Susan says: “Hace frío.” Di la forma natural en inglés.',help:'Objetivo: It’s cold.'},
 {person:'Eli',dir:'es_en',icon:'🔧',prompt:'Susan dice a propósito: “It makes sun.” Corrige el inglés.',help:'Objetivo: It’s sunny.'},
 {person:'Eli',dir:'es_en',icon:'🪟',prompt:'Pregúntale a Susan en inglés qué ve por la ventana y sigue su respuesta.',help:'Puedes empezar: What can you see from the window?'},
 {person:'Eli',dir:'es_en',icon:'☁️🔥',prompt:'Di una frase en inglés que combine nublado + calor.',help:'Objetivo: It’s cloudy, but it’s hot.'},
 {person:'Eli',dir:'es_en',icon:'↪️',prompt:'Cuenta una cosa verdadera sobre el tiempo y haz una pregunta corta para continuar.',help:'El objetivo es mantener la conversación, no construir una frase perfecta.'}
 ];
}
function startClass(){
 const all=buildClassCards(),susan=all.filter(x=>x.person==='Susan').sort(()=>Math.random()-.5),eli=all.filter(x=>x.person==='Eli').sort(()=>Math.random()-.5),items=[],startSusan=Math.random()<0.5;
 for(let i=0;i<10;i++){const useSusan=(i%2===0)?startSusan:!startSusan;items.push((useSusan?susan:eli).shift());}
 classSession={items:items.filter(Boolean),index:0};route='class';renderClass();
}
function renderClass(){
 if(!classSession){startClass();return;} if(classSession.index>=classSession.items.length){renderClassEnd();return;}
 const x=classSession.items[classSession.index],es=x.dir==='es_en',pct=classSession.index/classSession.items.length*100;
 document.getElementById('root').innerHTML=`${header()}<div class="small muted" style="text-align:center;margin-bottom:8px">TOGETHER · WEATHER & SMALL TALK</div><div class="progress-wrap"><div class="progress"><div style="width:${pct}%"></div></div><div class="counter">${classSession.index+1} / ${classSession.items.length}</div></div><div class="card class-card"><button class="btn help-btn" onclick='showHelp(${JSON.stringify({title:es?'AYUDA':'HELP',body:x.help})})'>?</button><div class="class-instruction">${x.person} · ${es?'aprende inglés':'learns Spanish'}</div><div class="flash-icon">${x.icon}</div><div class="class-main">${esc(x.prompt)}</div><p>${es?'Susan escucha y corrige si hace falta.':'Eli listens and corrects if needed.'}</p><button class="btn primary center" onclick="classNext()">${es?'SIGUIENTE':'NEXT'} →</button></div>`;
}
function classNext(){classSession.index++;renderClass();}
function renderClassEnd(){document.getElementById('root').innerHTML=`${header()}<div class="card"><h2>Session complete · Sesión terminada</h2><p>Write down only something that genuinely appeared and is worth revisiting. · Anotad solo algo que haya aparecido de verdad y merezca volver.</p><textarea id="classNote" placeholder="e.g. Susan still says ‘está sol’…"></textarea><button class="btn primary center" onclick="saveClassNote()">SAVE & FINISH</button></div>`;}
function saveClassNote(){const note=document.getElementById('classNote').value.trim(),s=S(),n=s.classNotes||[];if(note)n.push({date:new Date().toISOString(),topic:C.current_topic,note});save({classNotes:n});classSession=null;go('home');}
