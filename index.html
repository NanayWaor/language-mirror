<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f4f1e8">
<title>Language Mirror</title>
<style>
:root{--bg:#f4f1e8;--card:#fffdf8;--text:#252823;--muted:#6b716c;--line:#d8d3c6;--accent:#3b685b;--soft:#e9f1ed;--blue:#edf3fb;--blue2:#c7d9ed;--good:#e8f3e8;--goodline:#719479;--bad:#faece9;--badline:#bd7668;--note:#fff7dc;--shadow:0 3px 13px rgba(0,0,0,.05)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:19px;line-height:1.45}button,textarea{font:inherit}main{max-width:680px;margin:auto;padding:17px 13px 80px}h1{font-size:34px;line-height:1.05;margin:4px 0}h2{font-size:27px;line-height:1.15;margin:0 0 10px}h3{font-size:21px;margin:0 0 6px}.small{font-size:16px}.muted{color:var(--muted)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:19px;padding:17px;margin:13px 0;box-shadow:var(--shadow)}.btn{width:100%;min-height:56px;border:1.5px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:12px 14px;font-weight:780;text-align:left;cursor:pointer;white-space:normal}.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}.btn.soft{background:var(--soft);border-color:#bdd3ca}.btn.good{background:var(--good);border-color:var(--goodline)}.btn.bad{background:var(--bad);border-color:var(--badline)}.btn.center{text-align:center}.btn.compact{width:auto;min-height:42px;padding:8px 11px}.hidden{display:none!important}
.header{display:flex;align-items:flex-start;gap:8px;margin-bottom:14px}.header-title{flex:1;user-select:none;-webkit-user-select:none}.eyebrow{font-size:14px;font-weight:850;letter-spacing:.06em;color:var(--muted)}.mode-badge{width:auto;min-height:42px;padding:7px 10px;font-size:14px;background:transparent}.section-label{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.07em;margin:24px 4px 7px}.home-grid,.menu-list{display:grid;gap:9px}.home-btn{display:grid;grid-template-columns:42px minmax(0,1fr) 22px;gap:10px;align-items:center}.home-icon{font-size:30px;text-align:center}.arrow{font-size:23px;color:var(--muted)}
.topbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}.back{width:auto;min-height:42px;padding:7px 11px}.spacer{flex:1}.mission{background:linear-gradient(180deg,#fffdf8,#f8f5ed)}.mission-sub{color:var(--muted);margin-top:-3px}.group-title{font-size:14px;font-weight:900;color:var(--muted);letter-spacing:.06em;margin:19px 2px 7px}
.progress-wrap{display:grid;grid-template-columns:1fr auto;gap:9px;align-items:center;margin:6px 0 13px}.progress{height:7px;border-radius:999px;background:#dcd7cb;overflow:hidden}.progress>div{height:100%;background:var(--accent)}.counter{font-size:15px;color:var(--muted);font-weight:800}
.flash{min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}.help-btn{position:absolute;top:13px;right:13px;width:44px;height:44px;min-height:44px;border-radius:50%;padding:0;text-align:center;font-size:21px;background:var(--blue);border-color:var(--blue2)}.flash-icon{font-size:68px;line-height:1;text-align:center;margin:7px 0 14px}.flash-prompt{font-size:25px;line-height:1.27;font-weight:870;text-align:center;margin:6px 0 16px;overflow-wrap:anywhere}.flash-sub{font-size:17px;color:var(--muted);text-align:center;margin:-5px 0 14px}.answer{margin-top:12px;background:var(--soft);border-radius:15px;padding:14px;text-align:center;font-size:24px;font-weight:870;overflow-wrap:anywhere}.options{display:grid;gap:8px}.feedback{margin-top:12px;border-radius:14px;padding:13px;text-align:left;font-size:18px}.feedback.good{background:var(--good);border:1.5px solid var(--goodline)}.feedback.bad{background:var(--bad);border:1.5px solid var(--badline)}.audio{width:auto;min-height:44px;border:0;border-radius:12px;background:var(--accent);color:white;padding:8px 13px;font-weight:800;cursor:pointer;margin-top:10px}
.modal-bg{position:fixed;inset:0;background:rgba(31,34,31,.42);display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:20}.modal{width:min(650px,100%);max-height:82vh;overflow:auto;background:var(--card);border-radius:22px;padding:20px;box-shadow:0 12px 50px rgba(0,0,0,.22)}.modal-close{float:right;width:44px;min-height:44px;text-align:center;padding:0}.modal h2{padding-right:50px}
.ref-item{border-top:1.5px solid var(--line);padding:13px 0}.ref-item:first-child{border-top:0}.ref-target{font-size:22px;font-weight:850}.ref-source{font-size:16px;color:var(--muted)}textarea{width:100%;min-height:95px;border:1.5px solid var(--line);border-radius:13px;padding:11px;background:white;color:var(--text);resize:vertical}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{width:auto;min-height:42px;padding:8px 11px}.note{background:var(--note);border-radius:13px;padding:10px;margin-top:9px;font-size:17px}
.game-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.game-card{min-height:116px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center}.game-card .home-icon{font-size:38px}.match-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match-btn{min-height:70px;text-align:center}.match-btn.selected{background:var(--blue);border-color:#88a7c9}.match-btn.matched{background:var(--good);border-color:var(--goodline);opacity:.72}.memory-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.memory-card{min-height:92px;text-align:center;display:flex;align-items:center;justify-content:center;font-size:18px}.memory-card.covered{font-size:28px;background:var(--soft)}.memory-card.matched{background:var(--good);border-color:var(--goodline)}
.word-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin:14px auto;max-width:420px}.letter{aspect-ratio:1;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0;min-height:0;width:auto;font-size:14px;font-weight:850;display:flex;align-items:center;justify-content:center}.letter.sel{background:var(--blue);border-color:#7292b5}.letter.found{background:var(--good);border-color:var(--goodline)}.letter.hint{box-shadow:inset 0 0 0 3px #c59b4a}.phrase-list{display:grid;gap:5px;margin:12px 0}.phrase-status{display:flex;gap:8px;align-items:center}.phrase-status .mark{width:22px;text-align:center}.shown{color:var(--muted)}
.scene{font-size:74px;text-align:center;margin:8px 0}.class-person{text-align:center;font-size:20px;font-weight:900;margin-bottom:5px}.class-main{font-size:26px;font-weight:870;text-align:center;line-height:1.28;margin:10px 0}.class-instruction{text-align:center;color:var(--muted);font-size:17px}.class-banner{text-align:center;margin:2px 0 11px;color:var(--muted);font-size:16px}
details summary{cursor:pointer;font-weight:780}@media(min-width:760px){main{max-width:780px}.flash{min-height:455px}.word-grid{max-width:480px}.letter{font-size:16px}}
</style>
</head>
<body><main><div id="root"></div></main><div id="modalRoot"></div>
<script>
let C=null,direction=localStorage.getItem('lm_v6_direction')||'en_es';
const KEY='language_mirror_v6';
let screen={name:'home'},navStack=[],activity=null,titleTaps=[],classSession=null,game=null;
function S(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}}
function save(p){localStorage.setItem(KEY,JSON.stringify(Object.assign(S(),p,{updatedAt:new Date().toISOString()})))}
function tr(es,en){return direction==='es_en'?es:en}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function D(topic='weather',dir=direction){return C.topics[topic].directions[dir]}
function topicTitle(id,dir=direction){let t=C.topics[id].title;return t[dir==='en_es'?'en':'es']}
function missionTitle(){return C.weekly_mission.title[direction==='en_es'?'en':'es']}
function missionSub(){return C.weekly_mission.subtitle[direction==='en_es'?'en':'es']}
function nav(next){navStack.push(JSON.parse(JSON.stringify(screen)));screen=next;if(next.name!=='activity')activity=null;if(next.name!=='game')game=null;closeModal();scrollTo(0,0);render()}
function replace(next){screen=next;if(next.name!=='activity')activity=null;if(next.name!=='game')game=null;closeModal();scrollTo(0,0);render()}
function back(){if(navStack.length){screen=navStack.pop();activity=null;game=null;closeModal();scrollTo(0,0);render()}else replace({name:'home'})}
function home(){navStack=[];replace({name:'home'})}
function header(){return `<div class="header"><div class="header-title" onclick="secretTap()"><div class="eyebrow">LANGUAGE MIRROR · PROTOTYPE 006</div><h1>Language Mirror</h1></div><button class="btn mode-badge" onclick="languageSettings()">${direction==='en_es'?'Learning Spanish':'Aprendo inglés'}</button></div>`}
function topbar(title){return `<div class="topbar"><button class="btn back" onclick="back()">←</button><b>${esc(title)}</b><span class="spacer"></span></div>`}
function secretTap(){let n=Date.now();titleTaps=titleTaps.filter(x=>n-x<1400);titleTaps.push(n);if(titleTaps.length>=3){titleTaps=[];startClass()}}
function languageSettings(){document.getElementById('modalRoot').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="btn modal-close" onclick="closeModal()">×</button><h2>Language</h2><div class="menu-list"><button class="btn ${direction==='en_es'?'soft':''}" onclick="setDirection('en_es')">🇬🇧 I speak English · I’m learning Spanish</button><button class="btn ${direction==='es_en'?'soft':''}" onclick="setDirection('es_en')">🇪🇸 Hablo español · aprendo inglés</button></div></div></div>`}
function setDirection(d){direction=d;localStorage.setItem('lm_v6_direction',d);closeModal();render()}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function hb(icon,title,sub,onclick,primary=false){return `<button class="btn home-btn ${primary?'primary':''}" onclick="${onclick}"><span class="home-icon">${icon}</span><span><b>${esc(title)}</b><br><span class="small">${esc(sub)}</span></span><span class="arrow">›</span></button>`}
fetch('course.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{C=x;let q=new URLSearchParams(location.search);if(q.get('class')==='1')startClass();else render()}).catch(()=>document.getElementById('root').innerHTML='<div class="card">Could not load course.json.</div>');
function render(){if(!C)return;document.documentElement.lang=direction==='en_es'?'en':'es';let n=screen.name;if(n==='home')renderHome();else if(n==='explore')renderExplore();else if(n==='topic')renderTopicHub(screen.topic);else if(n==='activity')renderActivity();else if(n==='practiceMenu')renderPracticeMenu(screen.topic);else if(n==='patternMenu')renderPatternMenu(screen.topic);else if(n==='reference')renderReference(screen.topic);else if(n==='notes')renderNotes(screen.topic);else if(n==='ai')renderAI(screen.topic);else if(n==='games')renderGames(screen.topic);else if(n==='game')renderGame();else if(n==='class')renderClass();}
function renderHome(){document.getElementById('root').innerHTML=`${header()}<div class="section-label">${tr('HOY','TODAY')}</div><div class="home-grid">${hb('▶',tr('Sesión de hoy','Today’s session'),tr('Una mezcla elegida automáticamente para ti','A mix chosen automatically for you'),"startToday()",true)}</div><div class="section-label">${tr('ESTA SEMANA','THIS WEEK')}</div><div class="home-grid">${hb('🌦️',missionTitle(),missionSub(),"nav({name:'topic',topic:'weather',origin:'week'})")}</div><div class="section-label">${tr('EXPLORAR','EXPLORE')}</div><div class="home-grid">${hb('🗂️',tr('Explorar temas','Explore topics'),tr('Abre y practica libremente temas disponibles','Open and freely practise available topics'),"nav({name:'explore'})")}</div><details class="card" style="margin-top:29px"><summary>${tr('Ayudar a mejorar Language Mirror (opcional)','Help improve Language Mirror (optional)')}</summary><p class="small muted">${tr('No forma parte del estudio. Puedes ignorarlo.','This is not part of your study. You can ignore it.')}</p><div class="chips"><button class="btn chip" onclick="feedbackTag('clear')">👍 ${tr('Claro','Clear')}</button><button class="btn chip" onclick="feedbackTag('confusing')">❓ ${tr('Algo confunde','Something is confusing')}</button><button class="btn chip" onclick="feedbackTag('more')">💡 ${tr('Me falta algo','Something is missing')}</button></div><textarea id="improveText" placeholder="${esc(tr('Comentario opcional…','Optional comment…'))}"></textarea><button class="btn soft center" onclick="saveImprovement()">${tr('GUARDAR','SAVE')}</button><div id="improveStatus" class="small muted"></div></details>`}
function feedbackTag(tag){let s=S(),f=s.improvement||{};f.tag=tag;save({improvement:f});document.getElementById('improveStatus').textContent=tr('Guardado.','Saved.')}
function saveImprovement(){let s=S(),f=s.improvement||{};f.text=document.getElementById('improveText').value.trim();save({improvement:f});document.getElementById('improveStatus').textContent=tr('Comentario guardado.','Comment saved.')}
function renderExplore(){let ids=Object.entries(C.topics).filter(([id,x])=>x.directions).map(([id])=>id);document.getElementById('root').innerHTML=`${header()}${topbar(tr('Explorar temas','Explore topics'))}<div class="card"><p>${tr('Aquí puedes entrar en cualquier tema disponible. Explorar no cambia el plan semanal.','Open any available topic here. Exploring does not change the weekly plan.')}</p><div class="menu-list">${ids.map(id=>hb(C.topics[id].icon,topicTitle(id),id===C.current_topic?tr('Tema de esta semana','This week'):tr('Disponible para explorar','Available to explore'),`nav({name:'topic',topic:'${id}',origin:'explore'})`)).join('')}</div></div>`}
function hasGames(topic){return !!((D(topic).puzzle_phrases||[]).length||(C.topics[topic].game_scenes||[]).length)}
function renderTopicHub(topic){let d=D(topic),isCurrent=topic===C.current_topic;document.getElementById('root').innerHTML=`${header()}${topbar(topicTitle(topic))}<div class="card mission"><h2>${C.topics[topic].icon} ${esc(isCurrent?missionTitle():topicTitle(topic))}</h2>${isCurrent?`<p class="mission-sub">${esc(missionSub())}</p>`:''}<button class="btn primary center" onclick="startLearning('learn','${topic}')">${tr('EMPEZAR / CONTINUAR','START / CONTINUE')}</button></div><div class="card"><div class="group-title">${tr('APRENDER Y USAR','LEARN & USE')}</div><div class="menu-list">${hb('🪞',tr('Aprender','Learn'),tr('Tarjetas · audio · explicación ?','Cards · audio · ? explanation'),`startLearning('learn','${topic}')`)}${(d.phrases||[]).length?hb('💬',tr('Frases útiles','Useful phrases'),tr('Primero conoces la frase; después tendrás que producirla','First meet the phrase; later you will produce it'),`startLearning('phrases','${topic}')`):''}${hb('🧠',tr('Practicar','Practice'),tr('Recomendado · difíciles · aleatorio · patrones','Recommended · tricky · random · patterns'),`nav({name:'practiceMenu',topic:'${topic}'})`)}${isCurrent?hb('🪟',tr('Conversación real','Real-life conversation'),tr('Una conversación completa, no frases aisladas','A complete conversation, not isolated sentences'),`startLearning('conversation','${topic}')`):''}</div><div class="group-title">${tr('MÁS FORMAS DE USARLO','MORE WAYS TO USE IT')}</div><div class="menu-list">${hasGames(topic)?hb('🎲',tr('Juegos','Games'),tr('Puzles y actividades distintas de la práctica normal','Puzzles and activities different from normal practice'),`nav({name:'games',topic:'${topic}'})`):''}${hb('🗣️',tr('Hablar con IA','Talk with AI'),tr('Conversación guiada sobre este tema','Guided conversation about this topic'),`nav({name:'ai',topic:'${topic}'})`)}${hb('📝',tr('Mis notas','My notes'),tr('Tus asociaciones de este tema','Your memory links for this topic'),`nav({name:'notes',topic:'${topic}'})`)}${hb('📖',tr('Ver todo','View everything'),tr('Consulta rápida sin hacer una actividad','Quick reference without doing an activity'),`nav({name:'reference',topic:'${topic}'})`)}</div></div>`}
function itemKey(topic,item,dir=direction){return dir+'|'+topic+'|'+item.id}function schedule(){return S().schedule||{}}
function grade(topic,item,ok){let s=S(),all=s.schedule||{},k=itemKey(topic,item),z=all[k]||{seen:0,correct:0,wrong:0,streak:0,interval:0,due:0};z.seen++;z.last=Date.now();if(ok){z.correct++;z.streak++;let seq=[1,3,7,14,30,60];z.interval=seq[Math.min(z.streak-1,seq.length-1)];z.due=Date.now()+z.interval*86400000}else{z.wrong++;z.streak=0;z.interval=0;z.due=Date.now()+10*60*1000}all[k]=z;save({schedule:all})}
function exposureKey(topic,kind,id){return direction+'|'+topic+'|'+kind+'|'+id}function exposure(){return S().exposure||{}}function markExposure(topic,kind,id){let s=S(),e=s.exposure||{},k=exposureKey(topic,kind,id);e[k]=(e[k]||0)+1;save({exposure:e})}
function activeTopics(){let ids=new Set([C.current_topic]);Object.entries(C.topics).forEach(([id,x])=>{if(x.status==='review')ids.add(id)});return [...ids].filter(id=>C.topics[id]?.directions)}
function dynamicRetrieval(topic){let d=D(topic),ex=exposure(),out=[];(d.learn||[]).forEach(x=>{if(ex[exposureKey(topic,'learn',x.id)])out.push({id:'dyn_learn_'+x.id,type:'recall',icon:x.icon,prompt:x.source,answer_text:x.target,audio:x.audio||'',skill:'learn_'+x.id,why:(d.item_why?.[x.id]?.body)||''})});(d.phrases||[]).forEach(x=>{if(ex[exposureKey(topic,'phrase',x.id)])out.push({id:'dyn_phrase_'+x.id,type:'recall',icon:x.icon,prompt:x.source,answer_text:x.target,audio:x.audio||'',skill:'phrase_'+x.id,why:(d.phrase_why?.[x.id]?.body)||''})});return out}
function baseCandidates(topicIds=activeTopics()){let st=schedule(),out=[];topicIds.forEach(topic=>{let pool=[...(D(topic).practice_pool||[]),...dynamicRetrieval(topic)];pool.forEach(item=>{let z=st[itemKey(topic,item)]||{seen:0,correct:0,wrong:0,streak:0,due:0};let priority=(z.seen?0:5)+(z.due&&z.due<=Date.now()?8:0)+Math.min(8,z.wrong*2)-Math.min(3,z.streak);out.push({topic,item,z,priority})})});return out}
function readyForExtension(topic){let c=baseCandidates([topic]).filter(x=>x.item.type!=='mc'&&x.z.seen);let correct=c.reduce((a,x)=>a+x.z.correct,0),wrong=c.reduce((a,x)=>a+x.z.wrong,0);return c.length>=2&&correct>=6&&correct>=wrong*2}
function buildPractice(mode,topic=null,skill=null,count=8){let c=baseCandidates(topic?[topic]:activeTopics());if(mode==='tricky')c=c.filter(x=>x.z.wrong>0);if(skill)c=c.filter(x=>x.item.skill===skill);if(mode==='random')c.sort(()=>Math.random()-.5);else c.sort((a,b)=>b.priority-a.priority||Math.random()-.5);if(!c.length)c=baseCandidates(topic?[topic]:activeTopics()).sort(()=>Math.random()-.5);let items=c.slice(0,count).map(x=>({cardType:'practice',topic:x.topic,item:x.item}));let et=topic||C.current_topic;if(readyForExtension(et)&&D(et).extension_pool?.length&&items.length){let e=D(et).extension_pool[Math.floor(Math.random()*D(et).extension_pool.length)];items.splice(Math.min(items.length,5),0,{cardType:'practice',topic:et,item:e,extension:true})}return items.slice(0,count)}
function unseenLearning(topic){let d=D(topic),ex=exposure(),arr=[];(d.learn||[]).forEach(x=>{if(!ex[exposureKey(topic,'learn',x.id)])arr.push({cardType:'learn',type:'learn',topic,data:x})});(d.phrases||[]).forEach(x=>{if(!ex[exposureKey(topic,'phrase',x.id)])arr.push({cardType:'learn',type:'phrase',topic,data:x})});return arr}
function conversationCards(topic){if(topic!=='weather')return[];return direction==='en_es'?[{cardType:'learn',type:'conversation',topic,icon:'👋',prompt:'You meet your neighbour outside. Start naturally in Spanish.',answer:'Hola, ¿qué tal?'},{cardType:'learn',type:'conversation',topic,icon:'🪟',prompt:'Look outside. Your neighbour asks: “¿Qué tiempo hace?” Answer with one true sentence.',answer:'Example: Está nublado, pero hace calor.'},{cardType:'learn',type:'conversation',topic,icon:'↪️',prompt:'She answers. Keep the conversation going with one short reaction or question.',answer:'Examples: Sí, hace mucho viento. / ¿Crees que va a llover?'},{cardType:'learn',type:'conversation',topic,icon:'👋',prompt:'Finish the short neighbour chat naturally.',answer:'Example: Bueno, nos vemos luego.'}]:[{cardType:'learn',type:'conversation',topic,icon:'👋',prompt:'Te encuentras con tu vecina. Empieza de forma natural en inglés.',answer:'Hi, how are you?'},{cardType:'learn',type:'conversation',topic,icon:'🪟',prompt:'Mira fuera. Tu vecina te pregunta por el tiempo. Responde con una frase verdadera.',answer:'Example: It’s cloudy, but it’s hot.'},{cardType:'learn',type:'conversation',topic,icon:'↪️',prompt:'Ella responde. Mantén la conversación con una reacción o pregunta corta.',answer:'Examples: Yes, it’s very windy. / Do you think it’s going to rain?'},{cardType:'learn',type:'conversation',topic,icon:'👋',prompt:'Termina la conversación de vecinas de forma natural.',answer:'Example: Anyway, see you later.'}]}
function buildToday(){let items=[],current=C.current_topic,unseen=unseenLearning(current);if(unseen.length)items.push(unseen[0]);let due=buildPractice('recommended',null,null,5);items.push(...due.slice(0,3));if(unseen.length>1)items.splice(2,0,unseen[1]);let conv=conversationCards(current);if(conv.length)items.push(conv[Math.floor(Math.random()*conv.length)]);items.push(...due.slice(3));if(items.length<8){let extra=buildPractice('random',current,null,8-items.length);items.push(...extra)}return items.slice(0,8)}
function startToday(){activity={kind:'today',topic:C.current_topic,items:buildToday(),index:0,answered:false,results:[]};nav({name:'activity',source:'today'})}
function startLearning(kind,topic){let d=D(topic),items=[];if(kind==='learn')items=(d.learn||[]).map(x=>({cardType:'learn',type:'learn',topic,data:x}));if(kind==='phrases')items=(d.phrases||[]).map(x=>({cardType:'learn',type:'phrase',topic,data:x}));if(kind==='conversation')items=conversationCards(topic);let k=direction+'|'+topic+'|'+kind,idx=(S().sectionProgress||{})[k]||0;activity={kind,topic,items,index:Math.min(idx,Math.max(0,items.length-1)),answered:false,results:[]};nav({name:'activity',source:'topic'})}
function openPractice(mode='recommended',topic=null,skill=null){activity={kind:'practice',topic,items:buildPractice(mode,topic,skill),index:0,answered:false,results:[]};nav({name:'activity',source:'practice'})}

function startPhraseHunt(topic){game=makePhraseHunt(topic);nav({name:'game',gameType:'hunt',topic})}function normPhrase(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z]/g,'').toUpperCase()}
function makePhraseHunt(topic){let phrases=(D(topic).puzzle_phrases||[]).slice(0,5),N=12,grid=Array(N*N).fill(''),placements=[];let dirs=[[0,1],[1,0],[1,1],[-1,1]];function can(w,r,c,dr,dc){let er=r+dr*(w.length-1),ec=c+dc*(w.length-1);if(er<0||er>=N||ec<0||ec>=N)return false;for(let i=0;i<w.length;i++){let idx=(r+dr*i)*N+(c+dc*i);if(grid[idx]&&grid[idx]!==w[i])return false}return true}function place(w,pi){for(let tries=0;tries<200;tries++){let [dr,dc]=dirs[Math.floor(Math.random()*dirs.length)],r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);if(can(w,r,c,dr,dc)){let cells=[];for(let i=0;i<w.length;i++){let idx=(r+dr*i)*N+(c+dc*i);grid[idx]=w[i];cells.push(idx)}placements.push({pi,cells});return}}}phrases.forEach((p,i)=>place(normPhrase(p),i));let letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';grid=grid.map(x=>x||letters[Math.floor(Math.random()*letters.length)]);return{type:'hunt',topic,N,phrases,grid,placements,found:[],shown:false,start:null,hint:null}}
function startMatch(topic){let scenes=(C.topics[topic].game_scenes||[]).slice(0,4);let left=scenes.map((x,i)=>({id:i,text:x.icon})),right=scenes.map((x,i)=>({id:i,text:x[direction]})).sort(()=>Math.random()-.5);game={type:'match',topic,left,right,selL:null,selR:null,matched:[]};nav({name:'game',gameType:'match',topic})}
function startMemory(topic){let scenes=(C.topics[topic].game_scenes||[]).slice(0,4),cards=[];scenes.forEach((x,i)=>{cards.push({pair:i,text:x.icon});cards.push({pair:i,text:x[direction]})});cards.sort(()=>Math.random()-.5);game={type:'memory',topic,cards,open:[],matched:[]};nav({name:'game',gameType:'memory',topic})}
function startLookSay(topic){let scenes=(C.topics[topic].game_scenes||[]).slice().sort(()=>Math.random()-.5);game={type:'look',topic,scenes,index:0,revealed:false};nav({name:'game',gameType:'look',topic})}
function renderGame(){if(!game){back();return}if(game.type==='hunt')renderHunt();else if(game.type==='match')renderMatch();else if(game.type==='memory')renderMemory();else renderLookSay()}
function renderHunt(){let g=game;document.getElementById('root').innerHTML=`${header()}${topbar(tr('Caza de frases','Phrase hunt'))}<div class="card"><h2>🔎 ${tr('Encuentra la frase completa','Find the complete phrase')}</h2><p class="small muted">${tr('Toca la primera letra y después la última. Las frases pueden ir horizontal, vertical o diagonal.','Tap the first letter, then the last. Phrases may run horizontally, vertically or diagonally.')}</p><div class="phrase-list">${g.phrases.map((p,i)=>`<div class="phrase-status ${g.shown&&!g.found.includes(i)?'shown':''}"><span class="mark">${g.found.includes(i)?'✓':g.shown?'👁':'○'}</span><span>${esc(p)}</span></div>`).join('')}</div><div class="word-grid">${g.grid.map((l,i)=>`<button class="letter ${huntClass(i)}" onclick="huntTap(${i})">${l}</button>`).join('')}</div><div class="chips"><button class="btn chip" onclick="huntHint()">💡 ${tr('PISTA','HINT')}</button><button class="btn chip" onclick="huntShow()">👁 ${tr('VER RESPUESTAS','SHOW ANSWERS')}</button><button class="btn chip" onclick="game=makePhraseHunt('${g.topic}');renderGame()">↻ ${tr('OTRO','ANOTHER')}</button></div><div id="huntMsg" class="small muted" style="margin-top:9px"></div></div>`}
function huntClass(i){let g=game,cls=[];if(g.start===i)cls.push('sel');if(g.hint===i)cls.push('hint');if(g.placements.some(p=>(g.found.includes(p.pi)||g.shown)&&p.cells.includes(i)))cls.push('found');return cls.join(' ')}
function lineCells(a,b,N){let ar=Math.floor(a/N),ac=a%N,br=Math.floor(b/N),bc=b%N,dr=Math.sign(br-ar),dc=Math.sign(bc-ac),len=Math.max(Math.abs(br-ar),Math.abs(bc-ac))+1;if(!((ar===br)||(ac===bc)||(Math.abs(br-ar)===Math.abs(bc-ac))))return[];let cells=[];for(let k=0;k<len;k++)cells.push((ar+dr*k)*N+(ac+dc*k));return cells}
function huntTap(i){let g=game;if(g.shown)return;if(g.start===null){g.start=i;g.hint=null;renderGame();return}let cells=lineCells(g.start,i,g.N),hit=g.placements.find(p=>!g.found.includes(p.pi)&&(same(cells,p.cells)||same(cells,[...p.cells].reverse())));if(hit){g.found.push(hit.pi)}g.start=null;renderGame();setTimeout(()=>{let m=document.getElementById('huntMsg');if(m)m.textContent=hit?tr('¡Encontrada!','Found!'):tr('Esa línea no coincide. Prueba otra.','That line does not match. Try another.')},0)}function same(a,b){return a.length===b.length&&a.every((x,i)=>x===b[i])}
function huntHint(){let g=game,p=g.placements.find(x=>!g.found.includes(x.pi));if(!p)return;g.hint=p.cells[0];renderGame()}function huntShow(){game.shown=true;game.start=null;game.hint=null;renderGame()}
function renderMatch(){let g=game;document.getElementById('root').innerHTML=`${header()}${topbar(tr('Une la escena','Match the scene'))}<div class="card"><h2>🖼️ ${tr('Une cada escena con su frase','Match each scene with its phrase')}</h2><div class="match-cols"><div class="menu-list">${g.left.map((x,i)=>`<button class="btn match-btn ${g.selL===i?'selected':''} ${g.matched.includes(x.id)?'matched':''}" onclick="pickMatch('L',${i})">${x.text}</button>`).join('')}</div><div class="menu-list">${g.right.map((x,i)=>`<button class="btn match-btn ${g.selR===i?'selected':''} ${g.matched.includes(x.id)?'matched':''}" onclick="pickMatch('R',${i})">${esc(x.text)}</button>`).join('')}</div></div><div id="matchMsg" class="small muted" style="margin-top:10px"></div></div>`}
function pickMatch(side,i){let g=game;if(side==='L'){if(!g.matched.includes(g.left[i].id))g.selL=i}else{if(!g.matched.includes(g.right[i].id))g.selR=i}if(g.selL!==null&&g.selR!==null){let ok=g.left[g.selL].id===g.right[g.selR].id;if(ok)g.matched.push(g.left[g.selL].id);g.selL=g.selR=null;renderGame();setTimeout(()=>{let m=document.getElementById('matchMsg');if(m)m.textContent=ok?tr('✓ Bien.','✓ Good.'):tr('No es esa pareja. Prueba otra.','Not that pair. Try another.')},0)}else renderGame()}
function renderMemory(){let g=game;document.getElementById('root').innerHTML=`${header()}${topbar(tr('Parejas de memoria','Memory pairs'))}<div class="card"><h2>🃏 ${tr('Encuentra imagen + frase','Find picture + phrase')}</h2><div class="memory-grid">${g.cards.map((c,i)=>`<button class="btn memory-card ${g.matched.includes(c.pair)?'matched':g.open.includes(i)?'':'covered'}" onclick="memoryTap(${i})">${g.matched.includes(c.pair)||g.open.includes(i)?esc(c.text):'?'}</button>`).join('')}</div></div>`}
function memoryTap(i){let g=game;if(g.matched.includes(g.cards[i].pair)||g.open.includes(i)||g.open.length>=2)return;g.open.push(i);renderGame();if(g.open.length===2){let [a,b]=g.open;if(g.cards[a].pair===g.cards[b].pair)g.matched.push(g.cards[a].pair);setTimeout(()=>{g.open=[];renderGame()},650)}}
function renderLookSay(){let g=game,x=g.scenes[g.index%g.scenes.length];document.getElementById('root').innerHTML=`${header()}${topbar(tr('Mira y dilo','Look & say'))}<div class="card flash"><div class="counter" style="text-align:center">${g.index+1} / ${g.scenes.length}</div><div class="scene">${x.icon}</div><div class="flash-prompt">${tr('Di una frase completa antes de comprobar.','Say a complete phrase before checking.')}</div>${g.revealed?`<div class="answer">${esc(x[direction])}</div><button class="btn primary center" style="margin-top:12px" onclick="lookNext()">${tr('SIGUIENTE','NEXT')} →</button>`:`<button class="btn primary center" onclick="game.revealed=true;renderGame()">${tr('MOSTRAR','SHOW')}</button>`}</div>`}
function lookNext(){game.index++;game.revealed=false;if(game.index>=game.scenes.length){back()}else renderGame()}
function startClass(){let old=screen;screen={name:'class'};navStack.push(old);let cards=buildClassCards(),s=cards.filter(x=>x.person==='Susan').sort(()=>Math.random()-.5),e=cards.filter(x=>x.person==='Eli').sort(()=>Math.random()-.5),items=[],startSusan=Math.random()<.5;for(let i=0;i<5;i++){if(startSusan){if(s[i])items.push(s[i]);if(e[i])items.push(e[i])}else{if(e[i])items.push(e[i]);if(s[i])items.push(s[i])}}classSession={items:items.slice(0,10),index:0};render()}
function buildClassCards(){let a=[],add=(person,dir,icon,prompt,help)=>a.push({person,dir,icon,prompt,help});add('Susan','en_es','💨','Eli says: “It’s windy.” Say the natural Spanish.','Target: Hace viento.');add('Susan','en_es','🔧','Eli deliberately says: “Hace nublado.” Correct him.','Target: Está nublado.');add('Susan','en_es','🪟','Ask Eli in Spanish what the weather is like outside. React to the answer.','Useful start: ¿Qué tiempo hace?');add('Susan','en_es','🧩','Build one sentence with: nublado + pero + calor.','Target: Está nublado, pero hace calor.');add('Susan','en_es','🎭','Explain to Eli what the weather is like as if you had just met outside. Keep talking for two turns.','Use the language to communicate; perfection is not the goal.');add('Eli','es_en','🥶','Susan says: “Hace frío.” Say the natural English.','Objetivo: It’s cold.');add('Eli','es_en','🔧','Susan deliberately says: “It makes sun.” Correct the English.','Objetivo: It’s sunny.');add('Eli','es_en','🪟','Pregúntale a Susan en inglés qué ve por la ventana y sigue su respuesta.','Puedes empezar: What can you see from the window?');add('Eli','es_en','🧩','Construye una frase con: cloudy + but + hot.','Objetivo: It’s cloudy, but it’s hot.');add('Eli','es_en','🎭','Explícale a Susan qué tiempo hace como si os acabarais de encontrar fuera. Mantén dos turnos.','Usa el inglés para comunicar; no busques una frase perfecta.');return a}
function renderClass(){if(!classSession){startClass();return}if(classSession.index>=classSession.items.length){renderClassEnd();return}let x=classSession.items[classSession.index],es=x.dir==='es_en',pct=classSession.index/classSession.items.length*100;document.getElementById('root').innerHTML=`${header()}<div class="class-banner">TOGETHER · ${esc(missionTitle())}</div><div class="progress-wrap"><div class="progress"><div style="width:${pct}%"></div></div><div class="counter">${classSession.index+1} / ${classSession.items.length}</div></div><div class="card flash"><button class="btn help-btn" onclick='showHelp(${JSON.stringify({title:es?'AYUDA':'HELP',body:x.help})})'>?</button><div class="class-person">${x.person} · ${es?'aprende inglés':'learns Spanish'}</div><div class="flash-icon">${x.icon}</div><div class="class-main">${esc(x.prompt)}</div><div class="class-instruction">${es?'Susan escucha y corrige solo si hace falta.':'Eli listens and corrects only when useful.'}</div><button class="btn primary center" style="margin-top:16px" onclick="classSession.index++;renderClass()">${es?'SIGUIENTE':'NEXT'} →</button></div>`}
function renderClassEnd(){document.getElementById('root').innerHTML=`${header()}<div class="card"><h2>${tr('Clase terminada','Session complete')}</h2><p>${tr('Anotad solo algo que haya aparecido de verdad y merezca volver.','Write down only something that genuinely appeared and is worth revisiting.')}</p><textarea id="classNote" placeholder="e.g. Susan still says ‘hace nublado’…"></textarea><button class="btn primary center" onclick="saveClassNote()">${tr('GUARDAR Y TERMINAR','SAVE & FINISH')}</button></div>`}
function saveClassNote(){let note=document.getElementById('classNote').value.trim(),s=S(),n=s.classNotes||[];if(note)n.push({date:new Date().toISOString(),topic:C.current_topic,note});save({classNotes:n});classSession=null;back()}
function play(src){new Audio(src).play().catch(()=>alert(tr('No se pudo reproducir el audio.','The audio could not play.')))}function copyText(x){navigator.clipboard.writeText(x).then(()=>alert(tr('Copiado.','Copied.'))).catch(()=>prompt(tr('Copia este texto:','Copy this text:'),x))}
</script></body></html>
